{% extends "base.html" %}

{% block title %}Fun Stats - Sorcerers Summit{% endblock %}

{% block styles %}
<link
  rel="stylesheet"
  href="{{ url_for('static', filename='css/pages/fun-stats.css') }}?v={{ app_version }}" />
{% endblock %}

{% block content %}
<section class="hero">
  <h1>Fun Stats</h1>
  <p>Community records, rivalries, and bragging rights</p>
</section>

<!-- Filter Bar -->
<div class="fun-stats-filters">
  <div class="filter-group">
    <label for="event-filter">Event</label>
    <select id="event-filter">
      <option value="">Current</option>
    </select>
  </div>
  <div class="filter-group">
    <label for="source-filter">Source</label>
    <select id="source-filter">
      <option value="">All Sources</option>
    </select>
  </div>
</div>

<!-- Stats Grid -->
<div id="stats-grid" class="stats-grid">
  <div class="stats-loading">
    <div class="spinner"></div>
    <p>Loading stats...</p>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script
  src="{{ url_for('static', filename='js/pages/fun-stats.js') }}?v={{ app_version }}"
  defer></script>
{% endblock %}

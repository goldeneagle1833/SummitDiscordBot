name: Deploy Discord Bot

on:
  push:
    branches: [main]
    paths: ["discord-bot/**", "data/**"]
  pull_request:
    types: [closed]
    branches: [main]
    paths: ["discord-bot/**", "data/**"]
  workflow_dispatch: {}

jobs:
  deploy:
    # Run on push, or on a merged PR, or when manually dispatched
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Linode
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LINODE_HOST }}
          username: ${{ secrets.LINODE_USERNAME }}
          key: ${{ secrets.LINODE_SSH_KEY }}
          script: |
            cd /root/Summit/SummitDiscordBot

            # Clear any unmerged/conflicting paths (e.g. node_modules tracked by mistake)
            git diff --name-only --diff-filter=U | xargs -r git rm --cached 2>/dev/null || true
            git diff --cached --quiet || git commit -m "auto-resolve tracked conflicts" 2>/dev/null || true

            # Stash any local changes to avoid conflicts
            git stash

            # Pull latest changes
            git pull origin main

            # Apply stashed changes if any (will merge automatically)
            git stash pop || true

            # Install/update dependencies in venv
            cd discord-bot
            source venv/bin/activate
            pip install -r requirements.txt
            deactivate

            # Restart the service
            sudo systemctl restart summit-bot

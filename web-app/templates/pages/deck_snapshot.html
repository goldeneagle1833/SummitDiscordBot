<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deck Snapshot - Sorcerers Summit</title>
    <!-- Tailwind CSS (load first) -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/tailwind.output.css') }}" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/components/navbar.css') }}" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/pages/deck_snapshot.css') }}" />
  </head>
  <body>
    {% include 'components/navbar.html' %}

    <main>
      <a href="/player/{{ player_id }}" class="back-link">← Back to Profile</a>

      <div class="deck-snapshot-container" id="deck-snapshot">
        <div class="deck-header">
          <h1 class="deck-title" id="deck-title">Loading...</h1>
          <div class="deck-avatar" id="deck-avatar"></div>
          <div class="match-info" id="match-info"></div>
        </div>

        <div class="deck-content" id="deck-content" style="display: none">
          <div class="deck-sections">
            <!-- Minions Section -->
            <div class="deck-section-tile" id="minions-section">
              <h3 class="section-header">Minions</h3>
              <ul class="card-list" id="minions-list"></ul>
            </div>

            <!-- Magic Section -->
            <div class="deck-section-tile" id="magic-section">
              <h3 class="section-header">Magic</h3>
              <ul class="card-list" id="magic-list"></ul>
            </div>

            <!-- Artifacts Section -->
            <div class="deck-section-tile" id="artifacts-section">
              <h3 class="section-header">Artifacts</h3>
              <ul class="card-list" id="artifacts-list"></ul>
            </div>

            <!-- Auras Section -->
            <div class="deck-section-tile" id="auras-section">
              <h3 class="section-header">Auras</h3>
              <ul class="card-list" id="auras-list"></ul>
            </div>

            <!-- Atlas Section -->
            <div class="deck-section-tile" id="sites-section">
              <h3 class="section-header">Atlas</h3>
              <ul class="card-list" id="sites-list"></ul>
            </div>

            <!-- Collection Section -->
            <div class="deck-section-tile" id="collection-section">
              <h3 class="section-header">Collection</h3>
              <ul class="card-list" id="collection-list"></ul>
            </div>
          </div>
        </div>

        <div class="error-message" id="error-message" style="display: none"></div>
      </div>
    </main>

    <script>
      const matchId = {{ match_id }};
      const playerId = "{{ player_id }}";

      function getManaCost(card) {
        // Try different possible field names for mana cost
        return card.threshold || card.cost || card.mana || card.mana_cost || 0;
      }

      function getCardType(card) {
        // Normalize card type
        const type = (card.type || '').toLowerCase();
        if (type.includes('minion')) return 'Minion';
        if (type.includes('magic')) return 'Magic';
        if (type.includes('artifact')) return 'Artifact';
        if (type.includes('aura')) return 'Aura';
        if (type.includes('site')) return 'Site';
        return 'Other';
      }

      function renderCardList(cards, listId, sectionId) {
        const list = document.getElementById(listId);
        const section = document.getElementById(sectionId);

        if (!cards || cards.length === 0) {
          section.style.display = 'none';
          return;
        }

        list.innerHTML = '';

        // Sort cards by mana cost (lowest first)
        const sortedCards = [...cards].sort((a, b) => {
          return getManaCost(a) - getManaCost(b);
        });

        // Render each card with its quantity
        sortedCards.forEach(card => {
          const li = document.createElement('li');
          li.className = 'card-list-item';
          const cost = getManaCost(card);
          const quantity = card.quantity || 1;
          const costDisplay = cost > 0 ? `<span class="card-cost">${cost}</span>` : '';
          li.innerHTML = `<span class="card-count">${quantity}x</span> <span class="card-name">${card.name}</span>${costDisplay}`;
          list.appendChild(li);
        });

        section.style.display = 'block';
      }

      function filterByType(cards, type) {
        if (!cards) return [];
        return cards.filter(card => getCardType(card) === type);
      }

      async function fetchDeckData() {
        try {
          const res = await fetch(`/api/deck-snapshot/${matchId}/${playerId}`);

          if (!res.ok) {
            const data = await res.json();
            throw new Error(data.error || 'Failed to load deck data');
          }

          const data = await res.json();

          // Update header
          const deckName = data.deck.name || 'Unnamed Deck';
          document.getElementById('deck-title').textContent = deckName;
          document.title = `${deckName} - Deck Snapshot - Sorcerers Summit`;

          // Update avatar (compact display)
          if (data.deck.avatar && data.deck.avatar.length > 0) {
            const avatarName = data.deck.avatar[0].name || 'Unknown Avatar';
            document.getElementById('deck-avatar').textContent = avatarName;
          }

          // Update match info
          const date = new Date(data.date).toLocaleDateString();
          const resultClass = data.result === 'Win' ? 'match-win' : 'match-loss';
          document.getElementById('match-info').innerHTML = `
            <span class="${resultClass}">${data.result}</span> vs ${data.opponent_name} on ${date}
          `;

          // Split spellbook by card type
          const spellbook = data.deck.spellbook || [];
          const minions = filterByType(spellbook, 'Minion');
          const magic = filterByType(spellbook, 'Magic');
          const artifacts = filterByType(spellbook, 'Artifact');
          const auras = filterByType(spellbook, 'Aura');

          // Render spellbook sections
          renderCardList(minions, 'minions-list', 'minions-section');
          renderCardList(magic, 'magic-list', 'magic-section');
          renderCardList(artifacts, 'artifacts-list', 'artifacts-section');
          renderCardList(auras, 'auras-list', 'auras-section');

          // Render other sections
          renderCardList(data.deck.atlas, 'sites-list', 'sites-section');
          renderCardList(data.deck.sideboard, 'collection-list', 'collection-section');

          // Show content
          document.getElementById('deck-content').style.display = 'block';

        } catch (error) {
          document.getElementById('deck-title').textContent = 'Error';
          document.getElementById('error-message').textContent = error.message;
          document.getElementById('error-message').style.display = 'block';
          console.error(error);
        }
      }

      fetchDeckData();
    </script>

    <footer>
      <p>&copy; 2026 Summit. All rights reserved.</p>
    </footer>
    <script src="{{ url_for('static', filename='js/components/navbar.js') }}"></script>
  </body>
</html>

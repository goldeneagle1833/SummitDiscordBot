<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Life Counter Preview - Transparent Buttons</title>
  <link rel="icon" type="image/png" href="images/favicon.png">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #1a1a1a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1rem;
      background-color: rgba(26, 26, 26, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(147, 51, 234, 0.2);
    }

    .header-title {
      font-size: 0.875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .reset-btn {
      background: none;
      border: 1px solid #444;
      color: #ffffff;
      font-size: 1.5rem;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .reset-btn:hover {
      background-color: rgba(147, 51, 234, 0.2);
      border-color: #9333ea;
    }

    .reset-btn:active {
      transform: rotate(180deg);
      background-color: rgba(147, 51, 234, 0.3);
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      padding: 0.5rem;
      padding-top: 4rem;
      padding-bottom: calc(0.5rem + env(safe-area-inset-bottom));
      box-sizing: border-box;
    }

    .threshold-section {
      padding: 0.5rem;
      background-color: #2a2a2a;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      flex-shrink: 0;
    }

    .opponent-threshold {
      transform: rotate(180deg);
    }

    .threshold-label {
      font-size: 0.625rem;
      font-weight: 600;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      text-align: center;
      line-height: 1;
    }

    .threshold-elements {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.25rem;
      width: 100%;
    }

    .threshold-element {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #1a1a1a;
      border-radius: 6px;
      min-width: 0;
      min-height: 80px;
      overflow: hidden;
    }

    .element-display {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.25rem;
      width: 100%;
      height: 100%;
      position: relative;
      z-index: 5;
      pointer-events: none;
      justify-content: center;
      padding: 0.5rem;
    }

    .element-icon {
      width: 32px;
      height: 32px;
      background: #555;
      border-radius: 50%;
    }

    .element-counter-value {
      font-size: 1.5rem;
      font-weight: 700;
      color: #ffffff;
      text-align: center;
      user-select: none;
    }

    .element-decrement,
    .element-increment {
      position: absolute;
      width: 100%;
      height: 50%;
      font-size: 1rem;
      font-weight: 700;
      background-color: transparent;
      color: rgba(255, 255, 255, 0.25);
      border: none;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      z-index: 10;
      touch-action: manipulation;
    }

    .element-increment {
      top: 0;
      align-items: flex-start;
      padding-top: 0.25rem;
      color: rgba(74, 222, 128, 0.3);
    }

    .element-decrement {
      bottom: 0;
      align-items: flex-end;
      padding-bottom: 0.25rem;
      color: rgba(239, 68, 68, 0.3);
    }

    .element-decrement:hover,
    .element-increment:hover {
      background-color: rgba(147, 51, 234, 0.1);
    }

    .element-increment:active {
      background-color: rgba(74, 222, 128, 0.15);
      color: rgba(74, 222, 128, 0.6);
    }

    .element-decrement:active {
      background-color: rgba(239, 68, 68, 0.15);
      color: rgba(239, 68, 68, 0.6);
    }

    .life-section {
      padding: 0.5rem;
      background-color: #2a2a2a;
      border-radius: 8px;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
    }

    .opponent-life {
      transform: rotate(180deg);
    }

    .life-display {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .life-btn {
      position: absolute;
      left: 0;
      right: 0;
      width: 100%;
      min-height: 50%;
      font-size: 1.5rem;
      font-weight: 700;
      background-color: transparent;
      color: rgba(255, 255, 255, 0.3);
      border: none;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
      z-index: 10;
    }

    .life-btn.increment {
      top: 0;
      align-items: flex-start;
      padding-top: 1rem;
      color: rgba(74, 222, 128, 0.4);
    }

    .life-btn.decrement {
      bottom: 0;
      align-items: flex-end;
      padding-bottom: 1rem;
      color: rgba(239, 68, 68, 0.4);
    }

    .life-btn:hover,
    .life-btn:active {
      background-color: rgba(147, 51, 234, 0.1);
    }

    .life-btn.increment:active {
      background-color: rgba(74, 222, 128, 0.15);
      color: rgba(74, 222, 128, 0.7);
    }

    .life-btn.decrement:active {
      background-color: rgba(239, 68, 68, 0.15);
      color: rgba(239, 68, 68, 0.7);
    }

    .life-value-container {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      position: relative;
      z-index: 5;
      pointer-events: none;
    }

    .life-value {
      font-size: 6rem;
      font-weight: 700;
      color: #ffffff;
      transition: all 0.2s ease;
      text-align: center;
      line-height: 1;
      user-select: none;
    }

    .life-value.critical {
      color: #ef4444;
      animation: pulse 1s ease-in-out infinite;
    }

    .life-value.low {
      color: #f59e0b;
    }

    .life-value.high {
      color: #4ade80;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.8;
        transform: scale(1.05);
      }
    }

    .info-text {
      text-align: center;
      padding: 1rem;
      color: #888;
      font-size: 0.875rem;
    }

    @media (max-width: 375px) {
      .life-value {
        font-size: 5rem;
      }
      .life-btn {
        font-size: 1.25rem;
      }
    }

    @media (min-width: 376px) and (max-width: 768px) {
      .life-value {
        font-size: 8rem;
      }
      .life-btn {
        font-size: 1.75rem;
      }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-title">Life Counter Preview</div>
    <button id="reset-btn" class="reset-btn" aria-label="Reset counter">↻</button>
  </header>

  <div class="container">

    <!-- Opponent's Threshold (Rotated 180°) -->
    <section class="threshold-section opponent-threshold">
      <div class="threshold-label">Threshold</div>
      <div class="threshold-elements">
        <div class="threshold-element" data-element="water" data-player="player2">
          <button class="element-increment" data-player="player2" data-element="water">+</button>
          <button class="element-decrement" data-player="player2" data-element="water">−</button>
          <div class="element-display">
            <div class="element-icon">💧</div>
            <span class="element-counter-value" data-player="player2" data-element="water">0</span>
          </div>
        </div>
        <div class="threshold-element" data-element="fire" data-player="player2">
          <button class="element-increment" data-player="player2" data-element="fire">+</button>
          <button class="element-decrement" data-player="player2" data-element="fire">−</button>
          <div class="element-display">
            <div class="element-icon">🔥</div>
            <span class="element-counter-value" data-player="player2" data-element="fire">0</span>
          </div>
        </div>
        <div class="threshold-element" data-element="earth" data-player="player2">
          <button class="element-increment" data-player="player2" data-element="earth">+</button>
          <button class="element-decrement" data-player="player2" data-element="earth">−</button>
          <div class="element-display">
            <div class="element-icon">🌍</div>
            <span class="element-counter-value" data-player="player2" data-element="earth">0</span>
          </div>
        </div>
        <div class="threshold-element" data-element="air" data-player="player2">
          <button class="element-increment" data-player="player2" data-element="air">+</button>
          <button class="element-decrement" data-player="player2" data-element="air">−</button>
          <div class="element-display">
            <div class="element-icon">💨</div>
            <span class="element-counter-value" data-player="player2" data-element="air">0</span>
          </div>
        </div>
      </div>
    </section>

    <!-- Opponent's Life (Rotated 180°) -->
    <section class="life-section opponent-life">
      <div class="life-display">
        <button class="life-btn increment" data-player="player2">+</button>
        <div class="life-value-container">
          <span class="life-value" data-player="player2">20</span>
        </div>
        <button class="life-btn decrement" data-player="player2">−</button>
      </div>
    </section>

    <!-- Player's Life -->
    <section class="life-section player-life">
      <div class="life-display">
        <button class="life-btn increment" data-player="player1">+</button>
        <div class="life-value-container">
          <span class="life-value" data-player="player1">20</span>
        </div>
        <button class="life-btn decrement" data-player="player1">−</button>
      </div>
    </section>

    <!-- Player's Threshold -->
    <section class="threshold-section player-threshold">
      <div class="threshold-elements">
        <div class="threshold-element" data-element="water" data-player="player1">
          <button class="element-increment" data-player="player1" data-element="water">+</button>
          <button class="element-decrement" data-player="player1" data-element="water">−</button>
          <div class="element-display">
            <div class="element-icon">💧</div>
            <span class="element-counter-value" data-player="player1" data-element="water">0</span>
          </div>
        </div>
        <div class="threshold-element" data-element="fire" data-player="player1">
          <button class="element-increment" data-player="player1" data-element="fire">+</button>
          <button class="element-decrement" data-player="player1" data-element="fire">−</button>
          <div class="element-display">
            <div class="element-icon">🔥</div>
            <span class="element-counter-value" data-player="player1" data-element="fire">0</span>
          </div>
        </div>
        <div class="threshold-element" data-element="earth" data-player="player1">
          <button class="element-increment" data-player="player1" data-element="earth">+</button>
          <button class="element-decrement" data-player="player1" data-element="earth">−</button>
          <div class="element-display">
            <div class="element-icon">🌍</div>
            <span class="element-counter-value" data-player="player1" data-element="earth">0</span>
          </div>
        </div>
        <div class="threshold-element" data-element="air" data-player="player1">
          <button class="element-increment" data-player="player1" data-element="air">+</button>
          <button class="element-decrement" data-player="player1" data-element="air">−</button>
          <div class="element-display">
            <div class="element-icon">💨</div>
            <span class="element-counter-value" data-player="player1" data-element="air">0</span>
          </div>
        </div>
      </div>
      <div class="threshold-label">Threshold</div>
    </section>
  </div>

  <script>
    // Simple state tracking
    let state = {
      player1: {
        life: 20,
        threshold: { water: 0, fire: 0, earth: 0, air: 0 }
      },
      player2: {
        life: 20,
        threshold: { water: 0, fire: 0, earth: 0, air: 0 }
      },
      lifeHistory: []
    };

    function updateLife(player, amount) {
      const oldLife = state[player].life;
      state[player].life += amount;

      // Don't allow life to go below 0
      if (state[player].life < 0) {
        state[player].life = 0;
      }

      const newLife = state[player].life;

      // Record history (only if life actually changed)
      if (oldLife !== newLife) {
        state.lifeHistory.push({
          timestamp: Date.now(),
          player: player,
          oldLife: oldLife,
          newLife: newLife,
          change: amount
        });
      }

      // Update UI
      const lifeValueEl = document.querySelector(`.life-value[data-player="${player}"]`);
      if (lifeValueEl) {
        // Show "DD" when life is 0, otherwise show the number
        if (newLife === 0) {
          lifeValueEl.textContent = "DD";
        } else {
          lifeValueEl.textContent = newLife;
        }

        // Apply color classes
        lifeValueEl.classList.remove("critical", "low", "high");
        if (newLife === 0) {
          lifeValueEl.classList.add("critical");
        } else if (newLife <= 5) {
          lifeValueEl.classList.add("low");
        } else if (newLife >= 30) {
          lifeValueEl.classList.add("high");
        }
      }

      // Log history
      console.log(`Life History (${state.lifeHistory.length} changes):`, state.lifeHistory);

      // Haptic feedback
      if (navigator.vibrate) {
        navigator.vibrate(50);
      }
    }

    function updateThreshold(player, element, amount) {
      const oldValue = state[player].threshold[element];
      state[player].threshold[element] += amount;

      // Don't go below 0
      if (state[player].threshold[element] < 0) {
        state[player].threshold[element] = 0;
      }

      const newValue = state[player].threshold[element];

      // Update UI - just show the number
      const elementCounterEl = document.querySelector(
        `.element-counter-value[data-player="${player}"][data-element="${element}"]`
      );
      if (elementCounterEl) {
        elementCounterEl.textContent = newValue;
      }

      console.log(`${player} ${element}: ${oldValue} → ${newValue}`);

      // Haptic feedback
      if (navigator.vibrate) {
        navigator.vibrate(30);
      }
    }

    // Event listeners for life buttons
    document.querySelectorAll(".life-btn").forEach((btn) => {
      btn.addEventListener("click", function () {
        const player = this.dataset.player;
        const isIncrement = this.classList.contains("increment");
        const amount = isIncrement ? 1 : -1;
        updateLife(player, amount);
      });
    });

    // Event listeners for threshold element buttons
    document.querySelectorAll(".element-decrement, .element-increment").forEach((btn) => {
      btn.addEventListener("click", function (e) {
        e.preventDefault();
        e.stopPropagation();

        const player = this.dataset.player;
        const element = this.dataset.element;
        const isIncrement = this.classList.contains("element-increment");
        const amount = isIncrement ? 1 : -1;

        updateThreshold(player, element, amount);
      });
    });

    // Reset button
    document.getElementById("reset-btn").addEventListener("click", function () {
      if (confirm("Reset life counter and start a new game?")) {
        // Reset state
        state = {
          player1: {
            life: 20,
            threshold: { water: 0, fire: 0, earth: 0, air: 0 }
          },
          player2: {
            life: 20,
            threshold: { water: 0, fire: 0, earth: 0, air: 0 }
          },
          lifeHistory: []
        };

        // Update all UI elements
        document.querySelectorAll(".life-value").forEach(el => {
          el.textContent = "20";
          el.classList.remove("critical", "low", "high");
        });

        document.querySelectorAll(".element-counter-value").forEach(el => {
          el.textContent = "0";
        });

        console.log("Life counter reset");
      }
    });

    console.log("Life Counter Preview Ready");
    console.log("Try tapping the top/bottom halves of each section");
    console.log("Life counter shows 'DD' when at 0 and can't go negative");
    console.log("Threshold counters start at 0 and can't go negative");
    console.log("Life history will be logged to console");
  </script>
</body>
</html>

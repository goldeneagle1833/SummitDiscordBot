<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Sorcerers Summit{% endblock %}</title>

    <!-- Tailwind CSS (load first) -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/tailwind.output.css') }}?v={{ app_version }}" />

    <!-- Custom CSS (load after for overrides) -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/global.css') }}?v={{ app_version }}" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/utilities.css') }}?v={{ app_version }}" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/components/navbar.css') }}?v={{ app_version }}" />

    <!-- Page-specific CSS -->
    {% block styles %}{% endblock %}
  </head>
  <body class="min-h-screen bg-bg-dark text-text font-sans md:ml-48">
    {% include 'components/navbar.html' %}

    <main class="mt-16 mx-auto max-w-content px-4 sm:px-6 lg:px-8 py-8">
      {% block content %}{% endblock %}
    </main>

    {% include 'components/footer.html' %}

    <!-- Global JS -->
    <script src="{{ url_for('static', filename='js/main.js') }}?v={{ app_version }}"></script>
    <script src="{{ url_for('static', filename='js/components/navbar.js') }}?v={{ app_version }}" defer></script>

    <!-- Page-specific JS -->
    {% block scripts %}{% endblock %}
  </body>
</html>

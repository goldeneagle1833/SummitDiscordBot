<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Avatar Profile - Sorcerers Summit</title>
    <!-- Tailwind CSS (load first) -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/tailwind.output.css') }}" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/global.css') }}" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/components/navbar.css') }}" />
  </head>
  <body>
    {% include 'components/navbar.html' %}

    <main class="mt-16 mx-auto max-w-[1400px] px-4 sm:px-6 lg:px-8 py-8">
      <a
        href="/avatars"
        class="inline-flex items-center gap-2 mb-6 text-primary hover:underline font-medium">
        ← Back to Avatar Win Rates
      </a>

      <div
        class="bg-bg-surface border border-border rounded-soft overflow-hidden"
        id="avatar-profile">
        <div class="p-6 md:p-8 border-b border-border">
          <h1
            class="text-2xl sm:text-3xl md:text-4xl font-semibold mb-2 capitalize"
            id="avatar-name">
            Loading...
          </h1>
          <div
            class="text-base sm:text-lg text-text-muted"
            id="avatar-stats"></div>
        </div>

        <!-- Overall Stats -->
        <div class="p-6 md:p-8">
          <h3 class="text-lg md:text-xl font-semibold mb-4">
            📊 Overall Stats
          </h3>
          <div class="player-stats" id="avatar-stats-grid">
            <div class="stat-card">
              <div class="stat-value" id="stat-wins">-</div>
              <div class="stat-label">Wins</div>
            </div>
            <div class="stat-card">
              <div class="stat-value" id="stat-losses">-</div>
              <div class="stat-label">Losses</div>
            </div>
            <div class="stat-card">
              <div class="stat-value" id="stat-winrate">-</div>
              <div class="stat-label">Win Rate</div>
            </div>
            <div class="stat-card">
              <div class="stat-value" id="stat-matches">-</div>
              <div class="stat-label">Total Matches</div>
            </div>
          </div>
        </div>

        <!-- Wins History -->
        <div class="p-6 md:p-8 border-t border-border">
          <h3 class="text-lg md:text-xl font-semibold mb-4">✅ Wins</h3>
          <div class="overflow-x-auto -mx-6 md:mx-0">
            <div class="inline-block min-w-full align-middle px-6 md:px-0">
              <table
                class="min-w-full border border-border rounded-soft overflow-hidden match-history-table">
                <thead class="bg-bg-elevated border-b border-border">
                  <tr>
                    <th
                      class="px-4 py-3 text-left text-xs font-semibold text-text-muted uppercase">
                      Winner
                    </th>
                    <th
                      class="px-4 py-3 text-left text-xs font-semibold text-text-muted uppercase">
                      Loser
                    </th>
                    <th
                      class="px-4 py-3 text-left text-xs font-semibold text-text-muted uppercase">
                      ELO
                    </th>
                  </tr>
                </thead>
                <tbody id="wins-history-tbody">
                  <!-- Win history rows will be inserted here by JS -->
                </tbody>
              </table>
            </div>
          </div>
        </div>

        <!-- Losses History -->
        <div class="p-6 md:p-8 border-t border-border">
          <h3 class="text-lg md:text-xl font-semibold mb-4">❌ Losses</h3>
          <div class="overflow-x-auto -mx-6 md:mx-0">
            <div class="inline-block min-w-full align-middle px-6 md:px-0">
              <table
                class="min-w-full border border-border rounded-soft overflow-hidden match-history-table">
                <thead class="bg-bg-elevated border-b border-border">
                  <tr>
                    <th
                      class="px-4 py-3 text-left text-xs font-semibold text-text-muted uppercase">
                      Winner
                    </th>
                    <th
                      class="px-4 py-3 text-left text-xs font-semibold text-text-muted uppercase">
                      Loser
                    </th>
                    <th
                      class="px-4 py-3 text-left text-xs font-semibold text-text-muted uppercase">
                      ELO
                    </th>
                  </tr>
                </thead>
                <tbody id="losses-history-tbody">
                  <!-- Loss history rows will be inserted here by JS -->
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script>
      const avatarName = "{{ avatar_name }}";

      async function fetchAvatarData() {
        try {
          const res = await fetch(
            `/api/avatar/${encodeURIComponent(avatarName)}`
          );
          if (!res.ok) {
            document.getElementById("avatar-name").textContent =
              "Avatar not found";
            return;
          }
          const data = await res.json();

          // Update avatar info
          document.getElementById("avatar-name").textContent = data.name;
          document.getElementById(
            "avatar-stats"
          ).textContent = `${data.total_matches} matches played`;
          document.title = `${data.name} - Sorcerers Summit`;

          // Update overall stats
          document.getElementById("stat-wins").textContent = data.wins;
          document.getElementById("stat-losses").textContent = data.losses;
          document.getElementById(
            "stat-winrate"
          ).textContent = `${data.win_rate}%`;
          document.getElementById("stat-matches").textContent =
            data.total_matches;

          // Render wins history
          const winsTbody = document.getElementById("wins-history-tbody");
          winsTbody.innerHTML = "";

          if (data.wins_matches.length === 0) {
            winsTbody.innerHTML =
              '<tr><td colspan="3" class="px-4 py-8 text-center text-text-muted">No wins recorded</td></tr>';
          } else {
            data.wins_matches.forEach((match) => {
              const row = document.createElement("tr");
              const date = new Date(match.date).toLocaleDateString();
              const matchTime = match.match_time
                ? `${match.match_time} min`
                : "-";
              const matchId = match.match_id ? `#${match.match_id}` : "-";
              const eloChange = match.winner_elo_change;
              const eloSign = eloChange >= 0 ? "+" : "";

              row.className =
                "border-b border-border hover:bg-bg-elevated transition-colors";
              row.innerHTML = `
                <td class="px-4 py-3">${match.winner_name}</td>
                <td class="px-4 py-3">${match.loser_name}</td>
                <td class="px-4 py-3 text-accent-green font-semibold">${eloSign}${eloChange}</td>
              `;
              winsTbody.appendChild(row);
            });
          }

          // Render losses history
          const lossesTbody = document.getElementById("losses-history-tbody");
          lossesTbody.innerHTML = "";

          if (data.losses_matches.length === 0) {
            lossesTbody.innerHTML =
              '<tr><td colspan="3" class="px-4 py-8 text-center text-text-muted">No losses recorded</td></tr>';
          } else {
            data.losses_matches.forEach((match) => {
              const row = document.createElement("tr");
              const date = new Date(match.date).toLocaleDateString();
              const matchTime = match.match_time
                ? `${match.match_time} min`
                : "-";
              const matchId = match.match_id ? `#${match.match_id}` : "-";
              const eloChange = match.loser_elo_change;
              const eloSign = eloChange >= 0 ? "+" : "";

              row.className =
                "border-b border-border hover:bg-bg-elevated transition-colors";
              row.innerHTML = `
                <td class="px-4 py-3">${match.winner_name}</td>
                <td class="px-4 py-3">${match.loser_name}</td>
                <td class="px-4 py-3 text-accent-red font-semibold">${eloSign}${eloChange}</td>
              `;
              lossesTbody.appendChild(row);
            });
          }
        } catch (error) {
          document.getElementById("avatar-name").textContent =
            "Error loading avatar";
          console.error(error);
        }
      }

      fetchAvatarData();
    </script>

    <footer>
      <p>&copy; 2026 Summit. All rights reserved.</p>
    </footer>
    <script src="{{ url_for('static', filename='js/components/navbar.js') }}"></script>
  </body>
</html>

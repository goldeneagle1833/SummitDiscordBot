name: Debug event compact (temporary)
on:
  push:
    branches: [debug-event-compact]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python debug/probe.py

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    BearerAuth:
      type: http
      scheme: bearer
      description: API key sent as a Bearer token
    SessionAuth:
      type: apiKey
      in: cookie
      name: session
      description: Flask session cookie set after Discord/Google OAuth login
  responses:
    Unauthorized:
      description: Authentication required or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Authenticated but lacking required role
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Invalid or missing request data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        success:
          type: boolean
        error:
          type: string
        message:
          type: string
    ExternalMatchReport:
      type: object
      required:
      - winner_id
      - loser_id
      - winner_deck_url
      - loser_deck_url
      - source
      properties:
        winner_id:
          type: string
          description: Discord user ID of the winner
        loser_id:
          type: string
          description: Discord user ID of the loser
        winner_deck_url:
          type: string
          format: uri
        loser_deck_url:
          type: string
          format: uri
        source:
          type: string
          description: Identifier for the reporting application
        winner_name:
          type: string
        loser_name:
          type: string
        winner_went_first:
          type: boolean
        match_time:
          type: integer
          description: Duration in seconds
        match_comment:
          type: string
    MatchReportSubmission:
      type: object
      required:
      - opponent_user_id
      - result
      - went_first
      properties:
        opponent_user_id:
          type: string
        result:
          type: string
          enum:
          - won
          - lost
        went_first:
          type: string
          enum:
          - submitter
          - opponent
        submitter_deck_url:
          type: string
          format: uri
        opponent_deck_url:
          type: string
          format: uri
        final_life_submitter:
          type: integer
        final_life_opponent:
          type: integer

# Install to /etc/logrotate.d/summit
# copytruncate: gunicorn and the bot keep their file handles; no restart or
# reopen signal needed. Both open their logs in append mode, so writes land
# at the new end of file after truncation.
/var/log/summit-web/*.log /root/Summit/SummitDiscordBot/discord-bot/bot.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}

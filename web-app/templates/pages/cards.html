<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card Win Rates - Sorcerers Summit</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/tailwind.output.css') }}" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/global.css') }}" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/components/navbar.css') }}" />
  </head>
  <body>
    {% include 'components/navbar.html' %}

    <main>
      <section class="hero">
        <h1>Card Win Rates</h1>
        <p>Global card win rates calculated from matches reported with decklists</p>
      </section>

      <!-- Filters -->
      <section class="card-filters-section">
        <div class="card-filters-container">
          <div class="card-filters-row">
            <div class="card-filter-group">
              <label for="type-filter">Type</label>
              <select id="type-filter">
                <option value="">All Types</option>
                <option value="Minion">Minion</option>
                <option value="Magic">Magic</option>
                <option value="Artifact">Artifact</option>
                <option value="Site">Site</option>
                <option value="Aura">Aura</option>
              </select>
            </div>
            <div class="card-filter-group card-filter-search">
              <label for="card-search">Search</label>
              <input
                id="card-search"
                type="text"
                placeholder="Search cards..." />
            </div>
          </div>
          <div class="card-filter-count">
            Showing <span id="visible-count">0</span> of <span id="total-count">0</span> cards
          </div>
        </div>
      </section>

      <!-- Card tiles grid -->
      <section class="avatar-stats-section">
        <div class="avatar-stats-grid" id="card-stats-grid">
          <!-- Card tiles will be inserted here by JS -->
        </div>
      </section>
    </main>

    <script>
      // Color helper from Avatars page
      function getWinRateColor(winRate) {
        const percentage = Math.max(0, Math.min(100, winRate));
        if (percentage <= 50) {
          const ratio = percentage / 50;
          const r = Math.round(231 + (255 - 231) * ratio);
          const g = Math.round(76 + (255 - 76) * ratio);
          const b = Math.round(60 + (255 - 60) * ratio);
          return `rgb(${r}, ${g}, ${b})`;
        } else {
          const ratio = (percentage - 50) / 50;
          const r = Math.round(255 - (255 - 46) * ratio);
          const g = Math.round(255 - (255 - 204) * ratio);
          const b = Math.round(255 - (255 - 113) * ratio);
          return `rgb(${r}, ${g}, ${b})`;
        }
      }

      async function fetchCardStats() {
        try {
          const res = await fetch("/api/cards");
          const data = await res.json();

          const grid = document.getElementById("card-stats-grid");
          grid.innerHTML = "";

          if (!data || data.length === 0) {
            grid.innerHTML =
              '<p class="no-data">No card data available yet. Report matches with decklists to see stats!</p>';
            return;
          }

          // Sort by win_rate desc
          data.sort((a, b) => b.win_rate - a.win_rate || b.total - a.total);

          // Update total count
          document.getElementById("total-count").textContent = data.length;

          const renderedCards = [];
          data.forEach((card, idx) => {
            const color = getWinRateColor(card.win_rate);
            const cardTile = document.createElement("div");
            cardTile.className = "avatar-stats-card";
            cardTile.setAttribute("data-type", card.type || "Unknown");
            cardTile.setAttribute("data-name", card.name.toLowerCase());

            // Build background image HTML if image exists
            const bgImageHtml = card.image
              ? `<div class="card-bg-image" style="background-image: url('/card-images/${card.image}');"></div>`
              : '';

            cardTile.innerHTML = `
              ${bgImageHtml}
              <div class="avatar-stats-rank">#${idx + 1}</div>
              <div class="avatar-stats-name">
                ${card.name}
                <span style="position: absolute; right: var(--spacing-sm); font-size: 0.7rem; color: rgba(255, 255, 255, 0.6);">${
                  card.type || "Unknown"
                }</span>
              </div>
              <div class="avatar-stats-middle"></div>
              <div class="avatar-stats-bottom">
                <div class="avatar-stats-winrate" style="color: ${color};">${
              card.win_rate
            }%</div>
                <div class="avatar-stats-record">
                  <span class="match-win">${
                    card.wins
                  }W</span> - <span class="match-loss">${card.losses}L</span>
                </div>
              </div>
            `;
            grid.appendChild(cardTile);
            renderedCards.push(cardTile);
          });

          // Filtering logic
          const typeFilter = document.getElementById("type-filter");
          const searchInput = document.getElementById("card-search");

          function filterCards() {
            const type = typeFilter.value;
            const q = searchInput.value.trim().toLowerCase();
            let visible = 0;
            renderedCards.forEach((el) => {
              const cardType = el.getAttribute("data-type") || "";
              const name = el.getAttribute("data-name") || "";
              const typeMatch =
                !type ||
                (cardType && cardType.toLowerCase() === type.toLowerCase());
              const searchMatch = !q || name.includes(q);
              if (typeMatch && searchMatch) {
                el.style.display = "flex";
                visible++;
              } else {
                el.style.display = "none";
              }
            });
            // Update visible count
            document.getElementById("visible-count").textContent = visible;
          }

          typeFilter.addEventListener("change", filterCards);
          searchInput.addEventListener("input", filterCards);
          // initial filter pass
          filterCards();
        } catch (err) {
          console.error("Error fetching card stats", err);
          document.getElementById("card-stats-grid").innerHTML =
            '<p class="no-data">Error loading card stats</p>';
        }
      }

      fetchCardStats();
    </script>

    <footer>
      <p>&copy; 2026 Summit. All rights reserved.</p>
    </footer>
    <script src="{{ url_for('static', filename='js/components/navbar.js') }}"></script>
  </body>
</html>

name: Deploy MatchMaker Bot

on:
  push:
    branches: [main]
    paths: ["bot/**"]
  pull_request:
    types: [closed]
    branches: [main]
    paths: ["bot/**"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: ./bot
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run tests
        working-directory: ./bot
        run: |
          python -m pytest tests/ -v --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}/bot

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)

    steps:
      - name: Deploy to Linode
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.MATCHMAKER_LINODE_HOST }}
          username: ${{ secrets.MATCHMAKER_LINODE_USERNAME }}
          key: ${{ secrets.MATCHMAKER_LINODE_SSH_KEY }}
          script: |
            cd ~/MatchMakerBot

            # Stash any local changes to avoid conflicts
            git stash

            # Pull latest changes
            git pull origin main

            # Apply stashed changes if any
            git stash pop || true

            # Install/update dependencies in venv
            cd bot
            source venv/bin/activate
            pip install -r requirements.txt
            deactivate

            # Restart the service
            sudo systemctl restart matchmaker-bot

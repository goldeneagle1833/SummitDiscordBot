<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Player Profile - Sorcerers Summit</title>
    <!-- Tailwind CSS (load first) -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/tailwind.output.css') }}" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/global.css') }}" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/components/navbar.css') }}" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    {% include 'components/navbar.html' %}

    <main>
      <a href="/" class="back-link">← Back to Leaderboard</a>

      <div class="player-profile" id="player-profile">
        <div class="player-header">
          <div>
            <h1 class="player-name" id="player-name">Loading...</h1>
            <div class="player-elo" id="player-elo"></div>
            <div class="player-rank" id="player-rank"></div>
          </div>
        </div>

        <!-- Overall Stats -->
        <h3>📊 Overall Stats</h3>
        <div class="player-stats" id="player-stats">
          <div class="stat-card">
            <div class="stat-value" id="stat-wins">-</div>
            <div class="stat-label">Wins</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="stat-losses">-</div>
            <div class="stat-label">Losses</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="stat-winrate">-</div>
            <div class="stat-label">Win Rate</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="stat-matches">-</div>
            <div class="stat-label">Total Matches</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="stat-avg-time">-</div>
            <div class="stat-label">Avg Match Time</div>
          </div>
        </div>

        <!-- ELO History Graph -->
        <div
          class="elo-chart-section"
          id="elo-chart-section"
          style="display: none">
          <h3>📈 ELO History</h3>
          <div class="elo-chart-container">
            <canvas id="elo-chart"></canvas>
          </div>
        </div>

        <!-- Avatar Performance -->
        <div class="avatar-section" id="avatar-section" style="display: none">
          <h3>🎭 Avatar Performance</h3>
          <div class="avatar-grid" id="avatar-grid">
            <!-- Avatar cards will be inserted here by JS -->
          </div>
        </div>

        <!-- Performance Against Other Avatars -->
        <div
          class="avatar-matchup-section"
          id="avatar-matchup-section"
          style="display: none">
          <h3>⚔️ Performance Against Other Avatars</h3>
          <div class="avatar-grid" id="avatar-matchup-grid">
            <!-- Avatar matchup cards will be inserted here by JS -->
          </div>
        </div>

        <!-- Recent Decks -->
        <div
          class="recent-decks-section"
          id="recent-decks-section"
          style="display: none">
          <h3>🃏 Recent Decks</h3>
          <div class="recent-decks-list" id="recent-decks-list">
            <!-- Recent deck links will be inserted here by JS -->
          </div>
        </div>

        <!-- Match History -->
        <div class="match-history">
          <h3>📜 Match History</h3>
          <table class="match-history-table">
            <thead id="match-history-thead">
              <!-- Table headers will be inserted by JS based on is_owner -->
            </thead>
            <tbody id="match-history-tbody">
              <!-- Match history rows will be inserted here by JS -->
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <script>
      const playerId = "{{ player_id }}";

      function renderEloChart(currentElo, matches) {
        // Build ELO history by working backwards from current ELO
        // Matches are in DESC order (newest first)
        const eloHistory = [];
        let elo = currentElo;

        // Add current ELO as first point
        eloHistory.push({
          elo: elo,
          date: new Date().toLocaleDateString(),
          result: null,
          matchIndex: 0,
        });

        // Work backwards through matches to reconstruct ELO history
        for (let i = 0; i < matches.length; i++) {
          const match = matches[i];
          // Subtract the change to get previous ELO
          elo = elo - (match.elo_change || 0);
          eloHistory.push({
            elo: elo,
            date: new Date(match.date).toLocaleDateString(),
            result: match.result,
            matchIndex: i + 1,
          });
        }

        // Reverse to get chronological order (oldest to newest)
        eloHistory.reverse();

        // Prepare chart data
        const labels = eloHistory.map((_, i) =>
          i === 0 ? "Start" : `Match ${i}`
        );
        const eloData = eloHistory.map((h) => h.elo);
        const pointColors = eloHistory.map((h) => {
          if (h.result === null) return "#58a6ff"; // Current (primary blue)
          return h.result === "Win" ? "#3fb950" : "#f85149"; // Win green / Loss red
        });

        // Calculate min/max with padding, centered around 1500
        const minElo = Math.min(...eloData);
        const maxElo = Math.max(...eloData);
        const range = Math.max(maxElo - 1500, 1500 - minElo, 100);
        const yMin = Math.floor((1500 - range - 50) / 50) * 50;
        const yMax = Math.ceil((1500 + range + 50) / 50) * 50;

        const ctx = document.getElementById("elo-chart").getContext("2d");
        new Chart(ctx, {
          type: "line",
          data: {
            labels: labels,
            datasets: [
              {
                label: "ELO Rating",
                data: eloData,
                borderColor: "#58a6ff",
                backgroundColor: "rgba(88, 166, 255, 0.1)",
                borderWidth: 2,
                pointBackgroundColor: pointColors,
                pointBorderColor: pointColors,
                pointRadius: 4,
                pointHoverRadius: 6,
                fill: true,
                tension: 0.1,
              },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: {
              intersect: false,
              mode: "index",
            },
            plugins: {
              legend: {
                display: false,
              },
              tooltip: {
                backgroundColor: "#21262d",
                titleColor: "#f0f6fc",
                bodyColor: "#f0f6fc",
                borderColor: "#30363d",
                borderWidth: 1,
                padding: 12,
                displayColors: false,
                callbacks: {
                  title: function (context) {
                    const idx = context[0].dataIndex;
                    const point = eloHistory[idx];
                    if (idx === eloHistory.length - 1) return "Current";
                    if (idx === 0) return "Starting ELO";
                    return `Match ${idx}`;
                  },
                  label: function (context) {
                    const idx = context.dataIndex;
                    const point = eloHistory[idx];
                    const lines = [`ELO: ${point.elo}`];
                    if (point.result) {
                      lines.push(`Result: ${point.result}`);
                    }
                    return lines;
                  },
                },
              },
            },
            scales: {
              x: {
                display: true,
                grid: {
                  color: "rgba(48, 54, 61, 0.5)",
                  drawBorder: false,
                },
                ticks: {
                  color: "#8b949e",
                  maxTicksLimit: 10,
                  font: {
                    size: 11,
                  },
                },
              },
              y: {
                display: true,
                min: yMin,
                max: yMax,
                grid: {
                  color: function (context) {
                    // Highlight the 1500 baseline
                    if (context.tick.value === 1500) {
                      return "rgba(88, 166, 255, 0.5)";
                    }
                    return "rgba(48, 54, 61, 0.5)";
                  },
                  lineWidth: function (context) {
                    if (context.tick.value === 1500) {
                      return 2;
                    }
                    return 1;
                  },
                  drawBorder: false,
                },
                ticks: {
                  color: function (context) {
                    if (context.tick.value === 1500) {
                      return "#58a6ff";
                    }
                    return "#8b949e";
                  },
                  font: {
                    size: 11,
                    weight: function (context) {
                      if (context.tick && context.tick.value === 1500) {
                        return "bold";
                      }
                      return "normal";
                    },
                  },
                  stepSize: 50,
                },
              },
            },
          },
        });
      }

      async function fetchPlayerData() {
        try {
          const res = await fetch(`/api/player/${playerId}`);
          if (!res.ok) {
            document.getElementById("player-name").textContent =
              "Player not found";
            return;
          }
          const data = await res.json();

          // Update player info
          document.getElementById("player-name").textContent = data.name;
          document.getElementById(
            "player-elo"
          ).textContent = `ELO: ${data.elo}`;
          document.getElementById(
            "player-rank"
          ).textContent = `Rank #${data.rank}`;
          document.title = `${data.name} - Sorcerers Summit`;

          // Update overall stats
          document.getElementById("stat-wins").textContent = data.wins;
          document.getElementById("stat-losses").textContent = data.losses;
          document.getElementById(
            "stat-winrate"
          ).textContent = `${data.win_rate}%`;
          document.getElementById("stat-matches").textContent =
            data.wins + data.losses;
          document.getElementById("stat-avg-time").textContent =
            data.avg_match_time > 0 ? `${data.avg_match_time} min` : "-";

          // Render ELO history chart (only for profile owner)
          if (data.is_owner && data.matches && data.matches.length > 1) {
            document.getElementById("elo-chart-section").style.display =
              "block";
            renderEloChart(data.elo, data.matches);
          }

          // Update avatar performance
          if (data.avatar_performance && data.avatar_performance.length > 0) {
            document.getElementById("avatar-section").style.display = "block";
            const avatarGrid = document.getElementById("avatar-grid");
            avatarGrid.innerHTML = "";

            data.avatar_performance.forEach((avatar) => {
              const card = document.createElement("div");
              card.className = "avatar-card";
              card.innerHTML = `
                <div class="avatar-name">${avatar.name}</div>
                <div class="avatar-record">
                  <span class="match-win">${avatar.wins}</span> - <span class="match-loss">${avatar.losses}</span>
                </div>
                <div class="avatar-winrate">${avatar.win_rate}%</div>
              `;
              avatarGrid.appendChild(card);
            });
          }

          // Update performance against other avatars
          if (data.avatar_matchups && data.avatar_matchups.length > 0) {
            document.getElementById("avatar-matchup-section").style.display =
              "block";
            const avatarGrid = document.getElementById("avatar-matchup-grid");
            avatarGrid.innerHTML = "";

            data.avatar_matchups.forEach((matchup) => {
              const card = document.createElement("div");
              card.className = "avatar-card";
              card.innerHTML = `
                <div class="avatar-name">${matchup.opponent_avatar}</div>
                <div class="avatar-record">
                  <span class="match-win">${matchup.wins}</span> - <span class="match-loss">${matchup.losses}</span>
                </div>
                <div class="avatar-winrate">${matchup.win_rate}%</div>
              `;
              avatarGrid.appendChild(card);
            });
          }

          // Update recent decks (only show to profile owner)
          // TODO: When Discord OAuth is implemented, this will check if logged-in user owns this profile
          if (
            data.is_owner &&
            data.recent_decks &&
            data.recent_decks.length > 0
          ) {
            document.getElementById("recent-decks-section").style.display =
              "block";
            const decksList = document.getElementById("recent-decks-list");
            decksList.innerHTML = "";

            data.recent_decks.forEach((deck) => {
              const deckItem = document.createElement("div");
              deckItem.className = "recent-deck-item";
              const date = new Date(deck.date).toLocaleDateString();
              deckItem.innerHTML = `
                <div class="deck-info">
                  <div class="deck-avatar">🎭 ${deck.avatar}</div>
                  <div class="deck-name">${deck.deck_name}</div>
                  <div class="deck-date">${date}</div>
                </div>
                <a href="${deck.url}" target="_blank" class="deck-link-button">View Deck →</a>
              `;
              decksList.appendChild(deckItem);
            });
          }

          // Render match history table headers (conditionally include Deck column)
          const thead = document.getElementById("match-history-thead");
          if (data.is_owner) {
            thead.innerHTML = `
              <tr>
                <th>ID</th>
                <th>Result</th>
                <th>Opponent</th>
                <th>Deck Link</th>
                <th>Snapshot</th>
                <th>Deck Submitted</th>
                <th>ELO</th>
                <th>Play/Draw</th>
                <th>Time</th>
                <th>Date</th>
              </tr>
            `;
          } else {
            thead.innerHTML = `
              <tr>
                <th>ID</th>
                <th>Result</th>
                <th>Opponent</th>
                <th>Deck Submitted</th>
                <th>ELO</th>
                <th>Play/Draw</th>
                <th>Time</th>
                <th>Date</th>
              </tr>
            `;
          }

          // Update match history
          const tbody = document.getElementById("match-history-tbody");
          tbody.innerHTML = "";

          const colspanCount = data.is_owner ? 10 : 8;
          if (data.matches.length === 0) {
            tbody.innerHTML = `<tr><td colspan="${colspanCount}" style="text-align: center; opacity: 0.6;">No matches recorded</td></tr>`;
            return;
          }

          data.matches.forEach((match) => {
            const row = document.createElement("tr");
            const resultClass =
              match.result === "Win" ? "match-win" : "match-loss";
            const eloSign = match.elo_change >= 0 ? "+" : "";
            const date = new Date(match.date).toLocaleDateString();
            const matchTime = match.match_time
              ? `${match.match_time} min`
              : "-";
            const matchId = match.match_id ? `#${match.match_id}` : "-";
            const deckSubmitted = match.has_deck ? "✅" : "❌";

            // Build row HTML conditionally based on is_owner
            if (data.is_owner) {
              // Create deck link if available
              let deckLink = "-";
              if (
                match.player_deck_url &&
                match.player_deck_url !== "No URL provided" &&
                match.player_deck_url !== "Admin reported match"
              ) {
                deckLink = `<a href="${match.player_deck_url}" target="_blank" class="deck-link" title="View deck on Curiosa">🔗</a>`;
              }

              // Create snapshot link if deck has JSON data
              let snapshotLink = "-";
              if (match.has_deck_json) {
                snapshotLink = `<a href="/deck-snapshot/${match.match_id}/${playerId}" class="snapshot-link" title="View deck snapshot">View</a>`;
              }

              row.innerHTML = `
                <td class="match-id">${matchId}</td>
                <td class="${resultClass}">${match.result}</td>
                <td><a href="/player/${
                  match.opponent_id
                }" class="opponent-link">${match.opponent}</a></td>
                <td>${deckLink}</td>
                <td>${snapshotLink}</td>
                <td>${deckSubmitted}</td>
                <td class="${resultClass}">${eloSign}${match.elo_change}</td>
                <td>${match.first_player || "-"}</td>
                <td>${matchTime}</td>
                <td>${date}</td>
              `;
            } else {
              // Public view - show submitted status only
              row.innerHTML = `
                <td class="match-id">${matchId}</td>
                <td class="${resultClass}">${match.result}</td>
                <td><a href="/player/${
                  match.opponent_id
                }" class="opponent-link">${match.opponent}</a></td>
                <td>${deckSubmitted}</td>
                <td class="${resultClass}">${eloSign}${match.elo_change}</td>
                <td>${match.first_player || "-"}</td>
                <td>${matchTime}</td>
                <td>${date}</td>
              `;
            }
            tbody.appendChild(row);
          });
        } catch (error) {
          document.getElementById("player-name").textContent =
            "Error loading player";
          console.error(error);
        }
      }

      fetchPlayerData();
    </script>

    <footer>
      <p>&copy; 2026 Summit. All rights reserved.</p>
    </footer>
    <script src="{{ url_for('static', filename='js/components/navbar.js') }}"></script>
  </body>
</html>

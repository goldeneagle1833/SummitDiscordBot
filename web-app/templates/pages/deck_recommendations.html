<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sorcery Deck Rec - Sorcerers Summit</title>
    <link
      rel="icon"
      type="image/png"
      href="{{ url_for('static', filename='images/favicon.png') }}" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/tailwind.output.css') }}?v={{ app_version }}" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/global.css') }}?v={{ app_version }}" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}?v={{ app_version }}" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/components/navbar.css') }}?v={{ app_version }}" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/components/footer.css') }}?v={{ app_version }}" />
    <style>
      .deck-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 1rem;
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 var(--spacing-md) 2rem;
      }
      .deck-card {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 8px;
        padding: 1.25rem;
        text-decoration: none;
        color: inherit;
        display: block;
        transition: background 0.2s, border-color 0.2s, transform 0.15s;
      }
      .deck-card:hover {
        background: rgba(255, 255, 255, 0.15);
        border-color: rgba(255, 255, 255, 0.4);
        transform: translateY(-2px);
      }
      .deck-card-name {
        font-size: 1rem;
        font-weight: 600;
        color: #fff;
        margin-bottom: 0.35rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .deck-card-meta {
        font-size: 0.8rem;
        color: rgba(255, 255, 255, 0.75);
        margin-bottom: 0.2rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .deck-card-cluster {
        margin-top: 0.6rem;
        font-size: 0.78rem;
        color: rgba(255, 255, 255, 0.6);
      }
      .deck-card-cluster span {
        color: rgba(255, 255, 255, 0.9);
        font-weight: 600;
      }
      .avatar-filter-bar {
        max-width: 1200px;
        margin: 0 auto 1.5rem;
        padding: 0 var(--spacing-md);
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }
      .avatar-filter-bar label {
        font-size: 0.82rem;
        color: rgba(255, 255, 255, 0.7);
        white-space: nowrap;
        flex-shrink: 0;
      }
      .avatar-search-wrap {
        position: relative;
        width: 260px;
      }
      #avatar-search {
        width: 100%;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 6px;
        color: #fff;
        font-size: 0.875rem;
        padding: 0.4rem 2rem 0.4rem 0.75rem;
        outline: none;
        box-sizing: border-box;
        transition: border-color 0.15s, background 0.15s;
      }
      #avatar-search::placeholder { color: rgba(255, 255, 255, 0.4); }
      #avatar-search:focus {
        border-color: rgba(255, 255, 255, 0.5);
        background: rgba(255, 255, 255, 0.12);
      }
      .avatar-search-clear {
        position: absolute;
        right: 0.5rem;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        color: rgba(255, 255, 255, 0.45);
        cursor: pointer;
        font-size: 1rem;
        line-height: 1;
        padding: 0;
        display: none;
      }
      .avatar-search-clear:hover { color: rgba(255, 255, 255, 0.85); }
      .avatar-dropdown {
        position: absolute;
        top: calc(100% + 4px);
        left: 0;
        width: 100%;
        background: #1e1e2e;
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 6px;
        overflow: hidden;
        z-index: 100;
        display: none;
        max-height: 240px;
        overflow-y: auto;
      }
      .avatar-dropdown-item {
        padding: 0.5rem 0.75rem;
        font-size: 0.875rem;
        color: rgba(255, 255, 255, 0.85);
        cursor: pointer;
        transition: background 0.1s;
      }
      .avatar-dropdown-item:hover,
      .avatar-dropdown-item.highlighted {
        background: rgba(255, 255, 255, 0.12);
        color: #fff;
      }
      .avatar-active-tag {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        background: rgba(255, 255, 255, 0.15);
        border: 1px solid rgba(255, 255, 255, 0.35);
        border-radius: 4px;
        padding: 0.25rem 0.55rem;
        font-size: 0.8rem;
        color: #fff;
        font-weight: 600;
      }
      .avatar-active-tag button {
        background: none;
        border: none;
        color: rgba(255, 255, 255, 0.6);
        cursor: pointer;
        font-size: 0.9rem;
        line-height: 1;
        padding: 0;
      }
      .avatar-active-tag button:hover { color: #fff; }
      .spinner {
        display: flex;
        justify-content: center;
        padding: 4rem 0;
      }
      .spinner::after {
        content: "";
        width: 40px;
        height: 40px;
        border: 4px solid rgba(255, 255, 255, 0.15);
        border-top-color: rgba(255, 255, 255, 0.7);
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .error-msg {
        text-align: center;
        color: rgba(255, 255, 255, 0.5);
        padding: 3rem 0;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body class="md:ml-48">
    {% include 'components/navbar.html' %}

    <main>
      <section class="hero">
        <h1>Sorcery Deck Rec</h1>
        <p>
          Community-aggregated archetypes from tournament builds.<br />
          Click an archetype to see what cards players commonly run in that style.
        </p>
      </section>

      <div class="avatar-filter-bar" id="avatar-filter-bar" style="display:none;">
        <label for="avatar-search">Avatar:</label>
        <div class="avatar-search-wrap">
          <input id="avatar-search" type="text" placeholder="Search avatars…" autocomplete="off" />
          <button class="avatar-search-clear" id="avatar-search-clear" aria-label="Clear">✕</button>
          <div class="avatar-dropdown" id="avatar-dropdown"></div>
        </div>
        <div id="avatar-active-tag"></div>
      </div>

      <div id="deck-grid-wrapper">
        <div id="loading" class="spinner"></div>
        <div id="error-state" class="error-msg" style="display:none;">
          No tournament deck data available.
        </div>
        <div class="deck-grid" id="deck-grid" style="display:none;"></div>
      </div>
    </main>

    {% include 'components/footer.html' %}
    <script src="{{ url_for('static', filename='js/components/navbar.js') }}"></script>
    <script
      src="{{ url_for('static', filename='js/deck_recommendations.js') }}?v={{ app_version }}">
    </script>
  </body>
</html>

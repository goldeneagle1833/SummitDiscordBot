<!doctype html>
<html lang="en">
  <head>
    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2708861258582185"
         crossorigin="anonymous"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card Win Rates - Sorcerers Summit</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind.output.css') }}?v={{ app_version }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/global.css') }}?v={{ app_version }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v={{ app_version }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components/navbar.css') }}?v={{ app_version }}" />

    <link rel="stylesheet" href="{{ url_for('static', filename='css/components/footer.css') }}?v={{ app_version }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/pages/cards.css') }}?v={{ app_version }}" />
  </head>
  <body class="md:ml-48">
    {% include 'components/navbar.html' %}
    <main>
      <section class="hero">
        <h1>Card Win Rates</h1>
        <p>
          Global card win rates calculated from matches reported with decklists
        </p>
      </section>

      <!-- Filters -->
      <section class="card-filters-section">
        <div class="card-filters-container">
          <div class="card-filters-row">
            <div class="card-filter-group">
              <label for="type-filter">Type</label>
              <select id="type-filter">
                <option value="">All Types</option>
                <option value="Minion">Minion</option>
                <option value="Magic">Magic</option>
                <option value="Artifact">Artifact</option>
                <option value="Site">Site</option>
                <option value="Aura">Aura</option>
              </select>
            </div>
            <div class="card-filter-group card-filter-search">
              <label for="card-search">Search</label>
              <input
                id="card-search"
                type="text"
                placeholder="Search cards..." />
            </div>
          </div>
          <div class="card-filter-count">
            Showing <span id="visible-count">0</span> of
            <span id="total-count">0</span> cards
          </div>
        </div>
      </section>

      <!-- Card tiles grid -->
      <section class="avatar-stats-section">
        <div class="avatar-stats-grid" id="card-stats-grid">
          <!-- Card tiles will be inserted here by JS -->
        </div>
      </section>
    </main>    {% include 'components/footer.html' %}
<script src="{{ url_for('static', filename='js/components/navbar.js') }}?v={{ app_version }}"></script>
    <script src="{{ url_for('static', filename='js/pages/cards.js') }}?v={{ app_version }}" defer></script>
  </body>
</html>

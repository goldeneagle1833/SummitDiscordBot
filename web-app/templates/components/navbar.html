<!-- Navbar Component -->
<nav class="navbar">

      class="hamburger-btn"

  </div>

  <div class="navbar-right">
    <a href="/" class="nav-link">Home</a>

      rel="noopener noreferrer"

    >

      href="https://patreon.com/TheSorcerersSummit?utm_medium=unknown&utm_source=join_link&utm_campaign=creatorshare_fan&utm_content=copyLink"

# Summit Discord Bot Web Application - Nginx Configuration for Cloudflare
# This configuration is optimized for use with Cloudflare proxy
# Cloudflare handles SSL termination, so this server listens on HTTP only

server {
    listen 80;
    listen [::]:80;
    server_name sorcererssummit.com www.sorcererssummit.com;

    # Access and Error Logs
    access_log /var/log/nginx/summit-web-access.log;
    error_log /var/log/nginx/summit-web-error.log;

    # Max upload size (for deck images, avatars, etc.)
    client_max_body_size 10M;

    # Real IP Configuration for Cloudflare
    # This ensures logs show the actual visitor IP, not Cloudflare's IP
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Serve React frontend build
    root /root/Summit/SummitDiscordBot/web-app/frontend/dist;

    # Serve avatar images directly
    location /avatar-images/ {
        alias /root/Summit/SummitDiscordBot/web-app/templates/avatar_imgs/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Serve card images directly
    location /card-images/ {
        alias /root/Summit/SummitDiscordBot/web-app/card_images/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Proxy /top-8 and /deck-rec to Flask for OG preview handling.
    # Flask checks user agent: bots get OG meta tags, users get the SPA.
    # Cache-Control: no-store prevents Cloudflare from caching the SPA
    # response and serving it to bot crawlers (response varies by UA).
    location ~ ^/(top-8|deck-rec|player)(/|$) {
        proxy_pass http://unix:/tmp/summit-web.sock;

        add_header Cache-Control "no-store" always;
        add_header Vary "User-Agent" always;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header CF-Ray $http_cf_ray;
        proxy_set_header CF-Visitor $http_cf_visitor;
    }

    # Proxy API, auth, and static requests to Gunicorn
    location ~ ^/(api|auth|static)/ {
        proxy_pass http://unix:/tmp/summit-web.sock;

        # Proxy headers - trust Cloudflare's headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $server_name;

        # Cloudflare-specific headers
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header CF-Ray $http_cf_ray;
        proxy_set_header CF-Visitor $http_cf_visitor;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # React SPA catch-all: serve index.html for all other routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint (optional)
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}

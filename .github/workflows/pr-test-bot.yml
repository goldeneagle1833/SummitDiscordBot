# PR Testing Workflow - Deploys PR branches to test environment
name: Test Bot PR

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'discord-bot/**'
      - '.github/workflows/pr-test-bot.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          cd discord-bot
          pip install -r requirements.txt

      - name: Run pytest
        run: |
          cd discord-bot
          pytest tests/ -v
        continue-on-error: false

      - name: Syntax check all Python files
        run: |
          python -m py_compile discord-bot/**/*.py

      - name: Comment test results on PR
        if: always()
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Tests passed! PR is ready for review.'
            })

  # Optional: Deploy to test bot instance
  deploy-test:
    runs-on: ubuntu-latest
    needs: test
    if: github.event.pull_request.draft == false

    steps:
      - name: Comment deployment info
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `
              ## 🧪 Test Deployment

              To test this PR:
              1. Use the test Discord server (create a separate test server)
              2. Test bot token configured for test environment
              3. Test databases located at \`discord-bot/test_data/\`

              **Test Bot Invite**: [Add link to test bot here]
              **Test Server**: [Add link to test Discord server]
              `
            })

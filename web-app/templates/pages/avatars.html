<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Avatar Stats - Sorcerers Summit</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/components/navbar.css') }}" />
  </head>
  <body>
    {% include 'components/navbar.html' %}

    <main>
      <section class="hero">
        <h1>Avatar Win Rates</h1>
        <p>Global statistics from all matches reported with decklists</p>
      </section>

      <section class="avatar-stats-section">
        <div class="avatar-stats-grid" id="avatar-stats-grid">
          <!-- Avatar cards will be inserted here by JS -->
        </div>
      </section>
    </main>

    <script>
      async function fetchAvatarStats() {
        try {
          const res = await fetch("/api/avatars");
          const data = await res.json();
          const grid = document.getElementById("avatar-stats-grid");
          grid.innerHTML = "";

          if (data.length === 0) {
            grid.innerHTML =
              '<p class="no-data">No avatar data available yet. Report matches with decklists to see stats!</p>';
            return;
          }

          data.forEach((avatar, index) => {
            const card = document.createElement("a");
            card.href = `/avatar/${encodeURIComponent(avatar.name)}`;
            card.className = "avatar-stats-card";

            // Determine win rate color class
            let rateClass = "rate-neutral";
            if (avatar.win_rate >= 55) rateClass = "rate-high";
            else if (avatar.win_rate <= 45) rateClass = "rate-low";

            card.innerHTML = `
              <div class="avatar-stats-rank">#${index + 1}</div>
              <div class="avatar-stats-name">${avatar.name}</div>
              <div class="avatar-stats-winrate ${rateClass}">${
              avatar.win_rate
            }%</div>
              <div class="avatar-stats-record">
                <span class="match-win">${
                  avatar.wins
                }W</span> - <span class="match-loss">${avatar.losses}L</span>
              </div>
              <div class="avatar-stats-total">${avatar.total} games</div>
            `;
            grid.appendChild(card);
          });
        } catch (error) {
          console.error("Error fetching avatar stats:", error);
          document.getElementById("avatar-stats-grid").innerHTML =
            '<p class="no-data">Error loading avatar stats</p>';
        }
      }

      fetchAvatarStats();
    </script>

    <footer>
      <p>&copy; 2026 Summit. All rights reserved.</p>
    </footer>
    <script src="{{ url_for('static', filename='js/components/navbar.js') }}"></script>
  </body>
</html>

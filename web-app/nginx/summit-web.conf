# Summit Discord Bot Web Application - Nginx Configuration
# This file should be copied to /etc/nginx/sites-available/summit-web
# and symlinked to /etc/nginx/sites-enabled/summit-web

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name sorcererssummit.com www.sorcererssummit.com;

    # Redirect all HTTP requests to HTTPS
    return 301 https://$server_name$request_uri;
}

# HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sorcererssummit.com www.sorcererssummit.com;

    # SSL Configuration
    # NOTE: Update these paths to match your actual SSL certificate locations
    # These are typically managed by Certbot/Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/sorcererssummit.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sorcererssummit.com/privkey.pem;

    # SSL Security Settings (Mozilla Intermediate Configuration)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Max upload size (for deck images, avatars, etc.)
    client_max_body_size 10M;

    # Access and Error Logs
    access_log /var/log/nginx/summit-web-access.log;
    error_log /var/log/nginx/summit-web-error.log;

    # Serve static files directly (better performance)
    location /static/ {
        alias /root/Summit/SummitDiscordBot/web-app/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Serve avatar images directly
    location /avatar-images/ {
        alias /root/Summit/SummitDiscordBot/web-app/templates/avatar_imgs/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Proxy all other requests to Gunicorn
    location / {
        # Pass requests to Gunicorn Unix socket
        proxy_pass http://unix:/tmp/summit-web.sock;

        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;

        # WebSocket support (if needed in the future)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Health check endpoint (optional)
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}

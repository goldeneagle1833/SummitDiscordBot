# Install to /etc/ssh/sshd_config.d/00-summit-hardening.conf
# sshd takes the first value it sees for each option; the Include at the top
# of sshd_config means this file overrides the defaults below it.
# Every real login (workstation and the GitHub Actions deploy) already uses
# the ED25519 key in /root/.ssh/authorized_keys.
PermitRootLogin prohibit-password
PasswordAuthentication no
KbdInteractiveAuthentication no
MaxAuthTries 3

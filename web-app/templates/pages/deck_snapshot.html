<!doctype html>
<html lang="en">
  <head>
    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2708861258582185"
         crossorigin="anonymous"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deck Snapshot - Sorcerers Summit</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}?v={{ app_version }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/favicon.png') }}?v={{ app_version }}">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Almendra:ital,wght@0,400;0,700;1,400;1,700&family=Figtree:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind.output.css') }}?v={{ app_version }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/global.css') }}?v={{ app_version }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v={{ app_version }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components/navbar.css') }}?v={{ app_version }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components/footer.css') }}?v={{ app_version }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/pages/deck_snapshot.css') }}?v={{ app_version }}">
  </head>
  <body class="md:ml-48">
    {% include 'components/navbar.html' %}

    <main class="mt-16 mx-auto max-w-content px-4 sm:px-6 lg:px-8 py-8">
      <a href="/player/{{ player_id }}" class="back-link">← Back to Profile</a>

      <div class="deck-snapshot-container" id="deck-snapshot">
        <div class="deck-header">
          <h1 class="deck-title" id="deck-title">Loading...</h1>
          <div class="deck-avatar" id="deck-avatar"></div>
          <div class="match-info" id="match-info"></div>
        </div>

        <div class="deck-content hidden" id="deck-content">
          <div class="deck-sections">
            <!-- Minions Section -->
            <div class="deck-section-tile" id="minions-section">
              <h3 class="section-header">Minions</h3>
              <ul class="card-list" id="minions-list"></ul>
            </div>

            <!-- Magic Section -->
            <div class="deck-section-tile" id="magic-section">
              <h3 class="section-header">Magic</h3>
              <ul class="card-list" id="magic-list"></ul>
            </div>

            <!-- Artifacts Section -->
            <div class="deck-section-tile" id="artifacts-section">
              <h3 class="section-header">Artifacts</h3>
              <ul class="card-list" id="artifacts-list"></ul>
            </div>

            <!-- Auras Section -->
            <div class="deck-section-tile" id="auras-section">
              <h3 class="section-header">Auras</h3>
              <ul class="card-list" id="auras-list"></ul>
            </div>

            <!-- Atlas Section -->
            <div class="deck-section-tile" id="sites-section">
              <h3 class="section-header">Atlas</h3>
              <ul class="card-list" id="sites-list"></ul>
            </div>

            <!-- Collection Section -->
            <div class="deck-section-tile" id="collection-section">
              <h3 class="section-header">Collection</h3>
              <ul class="card-list" id="collection-list"></ul>
            </div>
          </div>
        </div>

        <div class="error-message hidden" id="error-message"></div>
      </div>
    </main>

    {% include 'components/footer.html' %}

    <script>
      // Pass template variables to JavaScript
      window.MATCH_ID = {{ match_id }};
      window.PLAYER_ID = "{{ player_id }}";
    </script>
    <script src="{{ url_for('static', filename='js/components/navbar.js') }}?v={{ app_version }}"></script>
    <script src="{{ url_for('static', filename='js/pages/deck_snapshot.js') }}?v={{ app_version }}" defer></script>
  </body>
</html>

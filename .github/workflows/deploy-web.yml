name: Deploy Web App

on:
  push:
    branches: [main]
    paths: ["web-app/**"]
  pull_request:
    types: [closed]
    branches: [main]
    paths: ["web-app/**"]
  workflow_dispatch: {}

jobs:
  deploy:
    # Run on push, or on a merged PR, or when manually dispatched
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Linode
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LINODE_HOST }}
          username: ${{ secrets.LINODE_USERNAME }}
          key: ${{ secrets.LINODE_SSH_KEY }}
          script: |
            cd /root/Summit/SummitDiscordBot

            # Stash any local changes to avoid conflicts
            git stash

            # Pull latest changes
            git pull origin main

            # Apply stashed changes if any (will merge automatically)
            git stash pop || true

            # Install/update dependencies in venv
            cd web-app
            source venv/bin/activate
            pip install -r requirements.txt
            deactivate

            # Restart the service
            sudo systemctl restart summit-web

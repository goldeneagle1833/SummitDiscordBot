<!-- Streaming Banner Component -->
<!-- This banner appears when someone from the Discord is streaming -->
<style>
  .streaming-banner {
    position: fixed;
    top: 64px; /* navbar height */
    left: 0;
    right: 0;
    z-index: 800;
    display: none;
  }

  @media (min-width: 768px) {
    .streaming-banner {
      margin-left: 192px; /* sidebar width */
    }
  }

  .streaming-banner.show {
    display: block;
  }

  .streaming-banner-inner {
    background: transparent;
    color: white;
    padding: 8px 16px;
  }

  .streaming-banner-content {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }

  .streamers-list {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }

  .streamer-card {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(232, 168, 0, 0.15);
    border: 1px solid rgba(232, 168, 0, 0.3);
    border-radius: 8px;
    padding: 8px 12px;
    text-decoration: none;
    color: white;
    transition:
      background 0.2s,
      border-color 0.2s;
  }

  .streamer-card:hover {
    background: rgba(232, 168, 0, 0.25);
    border-color: rgba(232, 168, 0, 0.5);
  }

  .live-indicator {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .live-dot-container {
    position: relative;
    width: 10px;
    height: 10px;
  }

  .live-dot-ping {
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: #f87171;
    opacity: 0.75;
    animation: ping 1s cubic-bezier(0, 0, 0.2, 1) infinite;
  }

  .live-dot {
    position: relative;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #ef4444;
  }

  @keyframes ping {
    75%,
    100% {
      transform: scale(2);
      opacity: 0;
    }
  }

  .live-text {
    font-weight: 700;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #ef4444;
  }

  .streamer-avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 2px solid rgba(232, 168, 0, 0.5);
  }

  .streamer-details {
    display: flex;
    flex-direction: column;
  }

  .streamer-name {
    font-weight: 600;
    font-size: 13px;
    color: #e0e0e0;
  }

  .stream-game {
    font-size: 11px;
    color: rgba(255, 255, 255, 0.6);
  }

  .platform-icon {
    font-size: 14px;
  }

  .close-banner-btn {
    background: none;
    border: none;
    color: rgba(255, 255, 255, 0.4);
    cursor: pointer;
    padding: 4px;
    transition: color 0.2s;
    margin-left: auto;
  }

  .close-banner-btn:hover {
    color: rgba(255, 255, 255, 0.8);
  }

  .close-banner-btn svg {
    width: 18px;
    height: 18px;
  }

  .hidden {
    display: none !important;
  }
</style>

<div id="streaming-banner" class="streaming-banner">
  <div class="streaming-banner-inner">
    <div class="streaming-banner-content">
      <div class="streamers-list" id="streamers-list">
        <!-- Streamer cards will be inserted here by JavaScript -->
      </div>

      <!-- Close button -->
      <button
        id="close-streaming-banner"
        class="close-banner-btn"
        aria-label="Close banner">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>
  </div>
</div>

<script>
  (function () {
    const BANNER_DISMISSED_KEY = "streaming_banner_dismissed";
    const CHECK_INTERVAL = 60000; // Check every 60 seconds

    function getPlatformIcon(platform) {
      if (platform === "Twitch") return '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="color: var(--color-primary, #e8a800)"><path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714z"/></svg>';
      if (platform === "YouTube") return '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="color: var(--color-primary, #e8a800)"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12z"/></svg>';
      return '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="color: var(--color-primary, #e8a800)"><path d="M21 6h-7.59l3.29-3.29L16 2l-4 4-4-4-.71.71L10.59 6H3a2 2 0 0 0-2 2v12c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8a2 2 0 0 0-2-2m0 14H3V8h18z"/></svg>';
    }

    function createStreamerCard(streamer) {
      const card = document.createElement("a");
      card.href = streamer.stream_url || "#";
      card.target = "_blank";
      card.rel = "noopener noreferrer";
      card.className = "streamer-card";

      card.innerHTML = `
        <span class="live-indicator">
          <span class="live-dot-container">
            <span class="live-dot-ping"></span>
            <span class="live-dot"></span>
          </span>
          <span class="live-text">Live</span>
        </span>
        ${streamer.avatar_url ? `<img src="${streamer.avatar_url}" alt="${streamer.display_name}" class="streamer-avatar">` : ""}
        <div class="streamer-details">
          <span class="streamer-name">${streamer.display_name}</span>
          <span class="stream-game">${streamer.game_name || "Streaming"}</span>
        </div>
        <span class="platform-icon">${getPlatformIcon(streamer.platform)}</span>
      `;

      return card;
    }

    async function checkStreamers() {
      try {
        const response = await fetch("/api/streamers");
        if (!response.ok) {
          console.warn(
            "Streamers API returned non-ok status:",
            response.status,
          );
          return;
        }

        const data = await response.json();
        console.log("Streamers API response:", data);
        const banner = document.getElementById("streaming-banner");
        const streamersList = document.getElementById("streamers-list");

        if (!data.streamers || data.streamers.length === 0) {
          console.log("No active streamers, hiding banner");
          banner.classList.remove("show");
          sessionStorage.removeItem(BANNER_DISMISSED_KEY);
          return;
        }

        // Check if user dismissed the banner this session
        const dismissed = sessionStorage.getItem(BANNER_DISMISSED_KEY);
        if (dismissed === "true") {
          console.log("Banner was dismissed by user");
          return;
        }

        // Clear and rebuild streamer cards
        streamersList.innerHTML = "";
        data.streamers.forEach((streamer) => {
          streamersList.appendChild(createStreamerCard(streamer));
        });

        // Show banner
        console.log("Showing banner for", data.streamers.length, "streamers");
        banner.classList.add("show");
      } catch (error) {
        console.error("Error checking streamers:", error);
      }
    }

    function closeBanner() {
      const banner = document.getElementById("streaming-banner");
      banner.classList.remove("show");
      sessionStorage.setItem(BANNER_DISMISSED_KEY, "true");
    }

    // Wait for DOM to be ready
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", function () {
        console.log("DOM loaded, initializing streaming banner");

        // Set up close button
        const closeBtn = document.getElementById("close-streaming-banner");
        if (closeBtn) {
          closeBtn.addEventListener("click", closeBanner);
        }

        // Initial check
        checkStreamers();

        // Periodic check
        setInterval(checkStreamers, CHECK_INTERVAL);
      });
    } else {
      console.log("DOM already loaded, initializing streaming banner");

      // Set up close button
      const closeBtn = document.getElementById("close-streaming-banner");
      if (closeBtn) {
        closeBtn.addEventListener("click", closeBanner);
      }

      // Initial check
      checkStreamers();

      // Periodic check
      setInterval(checkStreamers, CHECK_INTERVAL);
    }
  })();
</script>

name: Deploy Web App

on:
  push:
    branches: [main]
    paths: ["web-app/**"]
  workflow_dispatch: {}

jobs:
  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Linode
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LINODE_HOST }}
          username: ${{ secrets.LINODE_USERNAME }}
          key: ${{ secrets.LINODE_SSH_KEY }}
          script: |
            cd /root/Summit/SummitDiscordBot

            # Force-sync to latest origin/main (deploy target should always match remote)
            git fetch origin main
            git reset --hard origin/main

            # Install/update Python dependencies in venv
            cd web-app
            source venv/bin/activate
            pip install -r requirements.txt
            deactivate

            # Build React frontend
            cd frontend
            npm ci
            npm run build
            cd ../..

            # Restart the service
            sudo systemctl restart summit-web

            # Matchmaking priority pool (LFG queue requests); install/refresh its unit
            sudo cp web-app/systemd/summit-web-priority.service /etc/systemd/system/summit-web-priority.service
            sudo systemctl daemon-reload
            sudo systemctl enable summit-web-priority
            sudo systemctl restart summit-web-priority

            # Update Nginx config and reload if it changed
            sudo cp web-app/nginx/summit-web-cloudflare.conf /etc/nginx/sites-available/summit-web
            sudo nginx -t && sudo nginx -s reload

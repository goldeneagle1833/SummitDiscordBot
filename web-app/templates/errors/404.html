<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2708861258582185"
         crossorigin="anonymous"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}">
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/global.css') }}" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/components/navbar.css') }}" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/components/footer.css') }}" />
    <style>
      .error-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 60vh;
        text-align: center;
        padding: var(--spacing-2xl);
      }

      .error-code {
        font-size: 8rem;
        font-weight: 700;
        color: var(--color-primary);
        line-height: 1;
        margin-bottom: var(--spacing-lg);
      }

      .error-title {
        font-size: var(--font-size-2xl);
        margin-bottom: var(--spacing-md);
      }

      .error-message {
        color: var(--color-text-muted);
        font-size: var(--font-size-lg);
        margin-bottom: var(--spacing-xl);
        max-width: 500px;
      }

      .error-actions {
        display: flex;
        gap: var(--spacing-md);
      }
    </style>
  </head>
  <body>
    {% include 'components/navbar.html' %}

    <main>
      <div class="error-container">
        <div class="error-code">404</div>
        <h1 class="error-title">Page Not Found</h1>
        <p class="error-message">
          The page you're looking for doesn't exist or has been moved.
        </p>
        <div class="error-actions">
          <a href="/" class="btn btn--primary">Go Home</a>
          <a href="javascript:history.back()" class="btn btn--outline"
            >Go Back</a
          >
        </div>
      </div>
    </main>

    {% include 'components/footer.html' %}

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script src="{{ url_for('static', filename='js/components/navbar.js') }}"></script>
  </body>
</html>

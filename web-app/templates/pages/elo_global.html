{% extends "base.html" %}

{% block title %}Global ELO - Sorcerers Summit{% endblock %}

{% block content %}
      <section class="hero">
        <h1>Global ELO Leaderboard</h1>
        <p>Combined rankings from all servers</p>
      </section>

      <section class="leaderboard">
        <div class="leaderboard-content">
          <table id="leaderboard-table">
            <thead>
              <tr>
                <th>Rank</th>
                <th>Player</th>
                <th>W/L</th>
                <th>ELO</th>
              </tr>
            </thead>
            <tbody id="leaderboard-tbody">
              <!-- Leaderboard rows will be inserted here by JS -->
            </tbody>
          </table>
        </div>
      </section>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/pages/elo_global.js') }}?v={{ app_version }}" defer></script>
{% endblock %}

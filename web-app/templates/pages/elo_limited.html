<!doctype html>
<html lang="en">
  <head>
    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2708861258582185"
         crossorigin="anonymous"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Limited Format Leaderboard - Sorcerers Summit</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind.output.css') }}?v={{ app_version }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/global.css') }}?v={{ app_version }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v={{ app_version }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components/navbar.css') }}?v={{ app_version }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components/footer.css') }}?v={{ app_version }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/pages/elo.css') }}?v={{ app_version }}" />
  </head>
  <body class="md:ml-48">
    {% include 'components/navbar.html' %}
    <main>

  <section class="hero">
    <h1>Limited Format Leaderboard</h1>
    <p>Track player rankings in Limited (Arena Draft) mode</p>
  </section>

  <!-- Limited Leaderboard Section -->
  <section class="distribution-section wide">
    <h2 class="section-title">Limited ELO Leaderboard</h2>
    <p class="section-subtitle">Rankings based on Limited arena matches</p>

    <div class="distribution-controls centered">
      <label for="limited-count-select">Show:</label>
      <select id="limited-count-select">
        <option value="16" selected>Top 16</option>
        <option value="32">Top 32</option>
        <option value="50">Top 50</option>
        <option value="100">Top 100</option>
        <option value="all">All Players</option>
      </select>
    </div>

    <div class="distribution-table-container">
      <table class="distribution-table">
        <thead>
          <tr>
            <th class="col-rank">Rank</th>
            <th>Player</th>
            <th class="col-align-right">Limited ELO</th>
            <th class="col-align-right">W/L</th>
            <th class="col-align-right">Win %</th>
          </tr>
        </thead>
        <tbody id="limited-leaderboard-body">
          <!-- Rows will be inserted by JS -->
        </tbody>
      </table>
    </div>
  </section>

    </main>    {% include 'components/footer.html' %}
<script src="{{ url_for('static', filename='js/components/navbar.js') }}?v={{ app_version }}"></script>
    <script src="{{ url_for('static', filename='js/pages/elo_limited.js') }}?v={{ app_version }}" defer></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Match History - Sorcerers Summit</title>
    <link
      rel="icon"
      type="image/png"
      href="{{ url_for('static', filename='images/favicon.png') }}" />
    <!-- CSS Load Order -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/tailwind.output.css') }}?v={{ app_version }}" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/global.css') }}?v={{ app_version }}" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}?v={{ app_version }}" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/components/navbar.css') }}?v={{ app_version }}" />

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/components/footer.css') }}?v={{ app_version }}" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/pages/match_history.css') }}?v={{ app_version }}" />
  </head>
  <body class="md:ml-48">
    {% include 'components/navbar.html' %}

    <main>
      <section class="hero">
        <h1>Match History</h1>
        <p>Matches from the last 24 hours</p>
      </section>

      <section class="match-history-section">
        <h3 id="section-title">📜 Last 24 Hours</h3>

        <div class="date-picker-container">
          <label for="date-picker">Select Date:</label>
          <input type="date" id="date-picker" />
          <button>Show Last 24 Hours</button>
        </div>

        <div class="match-table-container">
          <table class="match-history-table">
            <thead>
              <tr>
                <th>Match ID</th>
                <th>Winner</th>
                <th>Winner ELO</th>
                <th>Loser</th>
                <th>Loser ELO</th>
                <th>Match Time</th>
                <th>Date</th>
              </tr>
            </thead>
            <tbody id="match-history-tbody">
              <tr>
                <td colspan="7" class="centered-message">Loading...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>    {% include 'components/footer.html' %}
<script src="{{ url_for('static', filename='js/components/navbar.js') }}?v={{ app_version }}"></script>
    <script src="{{ url_for('static', filename='js/pages/match_history.js') }}?v={{ app_version }}" defer></script>
  </body>
</html>

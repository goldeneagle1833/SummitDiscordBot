<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Sorcerers Summit{% endblock %}</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}?v={{ app_version }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/favicon.png') }}?v={{ app_version }}">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Almendra:ital,wght@0,400;0,700;1,400;1,700&family=Figtree:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

    <!-- CSS Load Order: vendor → base → utilities → components → page-specific -->

    <!-- 1. Vendor CSS (external libraries) -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/vendor/tailwind.output.css') }}?v={{ app_version }}" />

    <!-- 2. Base CSS (foundation) -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/base/reset.css') }}?v={{ app_version }}" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/base/variables.css') }}?v={{ app_version }}" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/base/typography.css') }}?v={{ app_version }}" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/base/layout.css') }}?v={{ app_version }}" />

    <!-- 3. Utilities CSS (helper classes) -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/utilities/spacing.css') }}?v={{ app_version }}" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/utilities/colors.css') }}?v={{ app_version }}" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/utilities/flexbox.css') }}?v={{ app_version }}" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/utilities/visibility.css') }}?v={{ app_version }}" />

    <!-- 4. Component CSS (global components) -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/components/navbar.css') }}?v={{ app_version }}" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/components/footer.css') }}?v={{ app_version }}" />

    <!-- 5. Page-specific CSS (loaded in child templates) -->
    {% block styles %}{% endblock %}
  </head>
  <body class="min-h-screen bg-bg-dark text-text font-sans md:ml-48">
    {% include 'components/navbar.html' %}

    <main class="mt-16 mx-auto max-w-content px-4 sm:px-6 lg:px-8 py-8">
      {% block content %}{% endblock %}
    </main>

    {% include 'components/footer.html' %}

    <!-- JS Load Order: core → components → page-specific -->

    <!-- 1. Core JS (global scripts) -->
    <script src="{{ url_for('static', filename='js/core/main.js') }}?v={{ app_version }}" defer></script>

    <!-- 2. Component JS (global components) -->
    <script
      src="{{ url_for('static', filename='js/components/navbar.js') }}?v={{ app_version }}"
      defer></script>

    <!-- 3. Page-specific JS (loaded in child templates) -->
    {% block scripts %}{% endblock %}
  </body>
</html>

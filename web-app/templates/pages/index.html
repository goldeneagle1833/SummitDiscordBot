<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sorcerers Summit</title>
    <!-- Tailwind CSS (load first) -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/tailwind.output.css') }}" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/global.css') }}" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/components/navbar.css') }}" />
  </head>
  <body>
    {% include 'components/navbar.html' %}

    <main>
      <section class="hero">
        <h1 id="hero-secret">Welcome to the Sorcery Community Leaderboard</h1>
        <p id="temp-notice" style="font-size: 0.9rem; color: #a0a0a0; margin-top: 0.5rem; text-align: center;">
          The menu (top left) should work now after a browser refresh (Ctrl+Shift+R)
        </p>
      </section>

      <section class="leaderboard">
        <div class="leaderboard-content">
          <table id="leaderboard-table">
            <thead>
              <tr>
                <th>Rank</th>
                <th>Player</th>
                <th>W/L</th>
                <th>ELO</th>
              </tr>
            </thead>
            <tbody id="leaderboard-tbody">
              <!-- Leaderboard rows will be inserted here by JS -->
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <script>
      // Hide temporary notice after 48 hours (expires Jan 26, 2026 at 21:37 UTC)
      (function() {
        const notice = document.getElementById('temp-notice');
        if (notice) {
          const expiryDate = new Date('2026-01-26T21:37:00Z');
          if (new Date() > expiryDate) {
            notice.style.display = 'none';
          }
        }
      })();

      // Fetch and render leaderboard from ELO DB
      async function fetchLeaderboard() {
        const res = await fetch("/api/leaderboard");
        const data = await res.json();
        const tbody = document.getElementById("leaderboard-tbody");
        tbody.innerHTML = "";
        data.forEach((player, i) => {
          const rank = i + 1;
          let rankDisplay = rank;
          if (rank <= 3) {
            rankDisplay = `<span class="rank-badge rank-${rank}">${rank}</span>`;
          }
          const row = document.createElement("tr");
          row.innerHTML = `
            <td>${rankDisplay}</td>
            <td><a href="/player/${player.id}" class="player-link">${player.name}</a></td>
            <td><span class="match-win">${player.wins}</span> / <span class="match-loss">${player.losses}</span></td>
            <td>${player.elo}</td>
          `;
          tbody.appendChild(row);
        });
      }
      fetchLeaderboard();
      // Auto-refresh every 30 seconds
      setInterval(fetchLeaderboard, 30000);

      // Secret easter egg: Triple-click the hero title
      const heroTitle = document.getElementById("hero-secret");
      if (heroTitle) {
        let clickCount = 0;
        let clickTimer;

        heroTitle.addEventListener("click", function (e) {
          clickCount++;

          if (clickCount === 3) {
            window.location.href = "/secret-fart-leaderboard";
            clickCount = 0;
            clearTimeout(clickTimer);
            return;
          }

          // Reset click count after 600ms if not triple-clicked
          clearTimeout(clickTimer);
          clickTimer = setTimeout(() => {
            clickCount = 0;
          }, 600);
        });

        // Add subtle cursor hint
        heroTitle.style.cursor = "default";
        heroTitle.style.userSelect = "none";
      }
    </script>

    <footer>
      <p>&copy; 2026 Summit. All rights reserved.</p>
    </footer>
    <script src="{{ url_for('static', filename='js/components/navbar.js') }}"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layout Debug</title>
  <style>
    body {
      background: #1a1a1a;
      color: white;
      font-family: sans-serif;
      padding: 1rem;
      max-width: 600px;
      margin: 0 auto;
    }

    .test-container {
      background: #2a2a2a;
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 2rem;
    }

    .threshold-elements {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.5rem;
      border: 2px solid lime; /* DEBUG */
    }

    .threshold-element {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      gap: 0.25rem;
      padding: 0.5rem;
      background-color: #1a1a1a;
      border-radius: 6px;
      border: 1px solid orange; /* DEBUG */
    }

    .element-display {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.25rem;
      flex: 1;
    }

    .element-icon {
      width: 32px;
      height: 32px;
      background: #555;
      border-radius: 4px;
    }

    .element-counter-value {
      font-size: 1.25rem;
      font-weight: 700;
    }

    .element-decrement,
    .element-increment {
      min-width: 32px;
      min-height: 32px;
      font-size: 1.25rem;
      font-weight: 700;
      background-color: #2a2a2a;
      color: white;
      border: 1px solid #444;
      border-radius: 4px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .debug-info {
      background: #333;
      padding: 1rem;
      margin-top: 1rem;
      border-radius: 4px;
      font-family: monospace;
      font-size: 0.875rem;
    }
  </style>
</head>
<body>
  <h1>Layout Debug Test</h1>

  <div class="test-container">
    <h2>Test 1: Grid Layout (Green border = grid container)</h2>
    <div class="threshold-elements">
      <div class="threshold-element">
        <button class="element-decrement">−</button>
        <div class="element-display">
          <div class="element-icon">💧</div>
          <span class="element-counter-value">0</span>
        </div>
        <button class="element-increment">+</button>
      </div>

      <div class="threshold-element">
        <button class="element-decrement">−</button>
        <div class="element-display">
          <div class="element-icon">🔥</div>
          <span class="element-counter-value">0</span>
        </div>
        <button class="element-increment">+</button>
      </div>

      <div class="threshold-element">
        <button class="element-decrement">−</button>
        <div class="element-display">
          <div class="element-icon">🌍</div>
          <span class="element-counter-value">0</span>
        </div>
        <button class="element-increment">+</button>
      </div>

      <div class="threshold-element">
        <button class="element-decrement">−</button>
        <div class="element-display">
          <div class="element-icon">💨</div>
          <span class="element-counter-value">0</span>
        </div>
        <button class="element-increment">+</button>
      </div>
    </div>

    <div class="debug-info">
      ✓ Expected: 4 columns side-by-side (GREEN border contains 4 ORANGE boxes)<br>
      ✗ If stacked: Grid not working - check CSS loading or parent constraints
    </div>
  </div>

  <div class="test-container">
    <h2>Test 2: Button Click Test</h2>
    <button id="test-btn" style="padding: 1rem; font-size: 1rem;">Click Me</button>
    <div id="click-count" style="margin-top: 0.5rem;">Clicks: 0</div>
  </div>

  <script>
    let clicks = 0;
    document.getElementById('test-btn').addEventListener('click', function() {
      clicks++;
      document.getElementById('click-count').textContent = 'Clicks: ' + clicks;
      console.log('Button clicked!', clicks);
    });

    // Test increment/decrement buttons
    document.querySelectorAll('.element-increment, .element-decrement').forEach(btn => {
      btn.addEventListener('click', function() {
        const counterEl = this.parentElement.querySelector('.element-counter-value');
        const current = parseInt(counterEl.textContent);
        const isIncrement = this.classList.contains('element-increment');
        counterEl.textContent = isIncrement ? current + 1 : Math.max(0, current - 1);
        console.log('Element counter updated:', counterEl.textContent);
      });
    });

    console.log('Layout debug test loaded');
    console.log('Grid container:', document.querySelector('.threshold-elements'));
    console.log('Grid items:', document.querySelectorAll('.threshold-element'));
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Season Leaderboard - Sorcerers Summit</title>
    <link
      rel="icon"
      type="image/png"
      href="{{ url_for('static', filename='images/favicon.png') }}" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/tailwind.output.css') }}?v={{ app_version }}" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/global.css') }}?v={{ app_version }}" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}?v={{ app_version }}" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/components/navbar.css') }}?v={{ app_version }}" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/components/footer.css') }}?v={{ app_version }}" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/pages/elo.css') }}?v={{ app_version }}" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/pages/season.css') }}?v={{ app_version }}" />
  </head>
  <body class="md:ml-48">
    {% include 'components/navbar.html' %}
    <main>

  <section class="hero" id="season-hero">
    <h1 id="season-title">Season Leaderboard</h1>
    <p id="season-subtitle">Loading...</p>
  </section>

  <!-- Season metadata -->
  <section id="season-info" class="distribution-section wide" style="display: none;">
    <div class="season-meta">
      <span id="season-dates"></span>
      <span id="season-region" style="display: none;"></span>
      <span id="season-creator"></span>
    </div>
    <p id="season-description" class="section-subtitle" style="display: none;"></p>
  </section>

  <!-- Season Leaderboard -->
  <section class="distribution-section wide">
    <div class="distribution-table-container">
      <table class="distribution-table">
        <thead>
          <tr>
            <th class="col-rank">Rank</th>
            <th>Player</th>
            <th class="col-align-right">W/L</th>
            <th class="col-align-right">ELO</th>
          </tr>
        </thead>
        <tbody id="leaderboard-tbody">
          <!-- Leaderboard rows will be inserted here by JS -->
        </tbody>
      </table>
      <p id="leaderboard-empty" class="empty-state" style="display: none;">
        No members in this season yet.
      </p>
    </div>
  </section>

    </main>
    {% include 'components/footer.html' %}
    <script src="{{ url_for('static', filename='js/components/navbar.js') }}?v={{ app_version }}"></script>
    <script>
      const SEASON_ID = {{ season_id }};
    </script>
    <script src="{{ url_for('static', filename='js/pages/season.js') }}?v={{ app_version }}" defer></script>
  </body>
</html>

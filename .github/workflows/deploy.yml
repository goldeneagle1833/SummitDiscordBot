name: Deploy Discord Bot to Linode

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Linode
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LINODE_HOST }}
          username: ${{ secrets.LINODE_USERNAME }}
          key: ${{ secrets.LINODE_SSH_KEY }}
          port: 22
          script: |
            echo "Starting deployment..."

            # Navigate to project directory
            cd ~/Summit/SummitDiscordBot

            # Pull latest changes
            git pull origin main

            # Update Python dependencies
            cd discord-bot
            source venv/bin/activate
            pip install -r requirements.txt

            # Stop the bot if running in screen
            if screen -ls | grep -q "discordbot"; then
              echo "Stopping existing bot screen session..."
              screen -X -S discordbot quit
              sleep 2
            fi

            # Start the bot in a new screen session
            echo "Starting bot in screen session..."
            screen -S discordbot -dm bash -c "cd ~/Summit/SummitDiscordBot/discord-bot && source venv/bin/activate && python main.py"

            # Wait a moment for bot to start
            sleep 3

            # Check if screen session is running
            if screen -ls | grep -q "discordbot"; then
              echo "✅ Bot screen session is running successfully!"
              screen -ls | grep discordbot
            else
              echo "❌ Bot screen session failed to start!"
              exit 1
            fi

            echo "🚀 Deployment completed successfully!"

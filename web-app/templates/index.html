<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sorcerers Summit</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}" />
  </head>
  <body>
    <nav>
      <div class="nav-container">
        <a href="/" class="logo">Sorcerers Summit</a>
        <ul class="nav-links">
          <li><a href="/">Home</a></li>
          <li><a href="/about">About</a></li>
        </ul>
      </div>
    </nav>

    <main>
      <section class="hero">
        <h1>Welcome to Sorcerers Summit Leaderboard</h1>
      </section>

      <section class="leaderboard">
        <div class="leaderboard-content">
          <table id="leaderboard-table">
            <thead>
              <tr>
                <th>Rank</th>
                <th>Player</th>
                <th>W/L</th>
                <th>ELO</th>
              </tr>
            </thead>
            <tbody id="leaderboard-tbody">
              <!-- Leaderboard rows will be inserted here by JS -->
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <script>
      // Fetch and render leaderboard from ELO DB
      async function fetchLeaderboard() {
        const res = await fetch("/api/leaderboard");
        const data = await res.json();
        const tbody = document.getElementById("leaderboard-tbody");
        tbody.innerHTML = "";
        data.forEach((player, i) => {
          const rank = i + 1;
          let rankDisplay = rank;
          if (rank <= 3) {
            rankDisplay = `<span class="rank-badge rank-${rank}">${rank}</span>`;
          }
          const row = document.createElement("tr");
          row.innerHTML = `
            <td>${rankDisplay}</td>
            <td><a href="/player/${player.id}" class="player-link">${player.name}</a></td>
            <td><span class="match-win">${player.wins}</span> / <span class="match-loss">${player.losses}</span></td>
            <td>${player.elo}</td>
          `;
          tbody.appendChild(row);
        });
      }
      fetchLeaderboard();
      // Auto-refresh every 30 seconds
      setInterval(fetchLeaderboard, 30000);
    </script>

    <footer>
      <p>&copy; 2026 Summit. All rights reserved.</p>
    </footer>
  </body>
</html>

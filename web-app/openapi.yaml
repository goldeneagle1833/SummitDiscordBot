openapi: 3.1.0
info:
  title: Summit Web App API
  version: 1.0.0
  description: 'REST API for the Sorcerers Summit web application (SummitDiscordBot companion app).


    Generated from the Flask route definitions in `web-app/routes/`. Auth model:

    - **Browser users**: Discord/Google OAuth session cookie (`SessionAuth`)

    - **Server-to-server**: `X-API-Key` header or `Authorization: Bearer <key>`


    Request/response bodies marked as generic objects should be refined from the handler source; endpoints documented
    in `API_DOCUMENTATION.md` include full schemas.'
  contact:
    name: goldeneagle1833
    url: https://github.com/goldeneagle1833/SummitDiscordBot
servers:
- url: https://sorcererssummit.com
  description: Production
- url: http://localhost:5000
  description: Local development
tags:
- name: leaderboard
  description: ELO leaderboards (current, lifetime, archived seasons)
- name: matches
  description: Ranked match records and date-range queries
- name: players
  description: Player profiles, stats, display names, blocking, account management
- name: avatars
  description: Avatar statistics, matchups, and image settings
- name: cards
  description: Card catalog, card stats, and card usage analytics
- name: games
  description: Game/deck data endpoints
- name: misc
  description: Status/health and miscellaneous endpoints
- name: streamers
  description: Streamer spotlight endpoints
- name: external_matches
  description: Server-to-server external match reporting (API-key only)
- name: admin
  description: Admin-only management endpoints
- name: match_reporting
  description: Web match reporting with two-party confirmation
- name: curios
  description: Curio tracking entries and sets
- name: seasons
  description: Season management
- name: limited
  description: Limited (draft/sealed) arena runs and matchmaking
- name: fun_stats
  description: Fun/novelty statistics
- name: events
  description: Tournament event data and top-8 decks
- name: analytics
  description: Public page-view/heartbeat analytics ingestion
- name: deck_rec
  description: Deck recommendation engine
- name: creator
  description: Content-creator tools (requires creator role)
- name: explorer
  description: Explorer standings events and seasons
- name: rumble
  description: Rumble game mode
- name: deck_builder
  description: Deck builder persistence and Curiosa import
- name: store
  description: Store products, cart, Stripe checkout, and order management
- name: card_points
  description: Card points budget deck validation
- name: reaction_roles
  description: Discord reaction-role configuration
- name: matchmaking
  description: Matchmaking queue endpoints
- name: auth
  description: Discord/Google OAuth login flows (browser session)

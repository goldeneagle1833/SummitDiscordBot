<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fun Stats - Sorcerers Summit</title>
    <link
      rel="icon"
      type="image/png"
      href="{{ url_for('static', filename='images/favicon.png') }}" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/tailwind.output.css') }}?v={{ app_version }}" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/global.css') }}?v={{ app_version }}" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}?v={{ app_version }}" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/components/navbar.css') }}?v={{ app_version }}" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/components/footer.css') }}?v={{ app_version }}" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/pages/fun-stats.css') }}?v={{ app_version }}" />
  </head>
  <body class="md:ml-48">
    {% include 'components/navbar.html' %}

    <main>
      <section class="hero">
        <h1>Fun Stats</h1>
        <p>Community records, rivalries, and bragging rights</p>
      </section>

      <!-- Filter Bar -->
      <div class="fun-stats-filters">
        <div class="filter-group">
          <label for="event-filter">Event</label>
          <select id="event-filter">
            <option value="">Current</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="source-filter">Source</label>
          <select id="source-filter">
            <option value="">All Sources</option>
          </select>
        </div>
      </div>

      <!-- Stats Grid -->
      <div id="stats-grid" class="stats-grid">
        <div class="stats-loading">
          <div class="spinner"></div>
          <p>Loading stats...</p>
        </div>
      </div>
    </main>

    {% include 'components/footer.html' %}
    <script src="{{ url_for('static', filename='js/pages/fun-stats.js') }}?v={{ app_version }}"></script>
    <script src="{{ url_for('static', filename='js/components/navbar.js') }}"></script>
  </body>
</html>

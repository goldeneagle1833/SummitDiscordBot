<!doctype html>
<html lang="en">
  <head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2708861258582185" crossorigin="anonymous"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deck Stats - Sorcerers Summit</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}?v={{ app_version }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/favicon.png') }}?v={{ app_version }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Almendra:ital,wght@0,400;0,700;1,400;1,700&family=Figtree:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind.output.css') }}?v={{ app_version }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/global.css') }}?v={{ app_version }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v={{ app_version }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components/navbar.css') }}?v={{ app_version }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components/footer.css') }}?v={{ app_version }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/pages/deck_stats.css') }}?v={{ app_version }}" />
  </head>
  <body class="md:ml-48">
    {% include 'components/navbar.html' %}

    <main class="mt-16 mx-auto max-w-content px-4 sm:px-6 lg:px-8 py-8">
      <a href="/player/{{ player_id }}" class="back-link">← Back to Profile</a>

      <div id="deck-stats-container">
        <div id="loading-state" class="ds-loading">Loading deck stats…</div>
        <div id="error-state" class="ds-error hidden"></div>

        <!-- Header -->
        <div id="ds-header" class="ds-header hidden">
          <h1 id="ds-deck-name" class="ds-title"></h1>
          <div id="ds-avatar" class="ds-subtitle"></div>
          <a id="ds-deck-link" href="#" target="_blank" class="ds-external-link">View on Curiosa →</a>
        </div>

        <!-- Summary stats -->
        <div id="ds-summary" class="ds-summary-grid hidden">
          <div class="ds-stat-card">
            <div class="ds-stat-value" id="ds-wins">-</div>
            <div class="ds-stat-label">Wins</div>
          </div>
          <div class="ds-stat-card">
            <div class="ds-stat-value" id="ds-losses">-</div>
            <div class="ds-stat-label">Losses</div>
          </div>
          <div class="ds-stat-card">
            <div class="ds-stat-value" id="ds-total">-</div>
            <div class="ds-stat-label">Total Games</div>
          </div>
          <div class="ds-stat-card ds-stat-winrate">
            <div class="ds-stat-value" id="ds-winrate">-</div>
            <div class="ds-stat-label">Win Rate</div>
          </div>
          <div class="ds-stat-card">
            <div class="ds-stat-value" id="ds-on-play">-</div>
            <div class="ds-stat-label">On Play</div>
          </div>
          <div class="ds-stat-card">
            <div class="ds-stat-value" id="ds-on-draw">-</div>
            <div class="ds-stat-label">On Draw</div>
          </div>
        </div>

        <!-- Matchups -->
        <section id="ds-matchups-section" class="ds-section hidden">
          <h2 class="ds-section-title">Performance vs Avatars</h2>
          <div id="ds-matchups-grid" class="ds-matchups-grid"></div>
        </section>

        <!-- Match History -->
        <section id="ds-history-section" class="ds-section hidden">
          <h2 class="ds-section-title">Match History</h2>
          <div class="ds-table-wrap">
            <table class="ds-table">
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Result</th>
                  <th>Opponent</th>
                  <th>Opp. Avatar</th>
                  <th>ELO</th>
                  <th>Time</th>
                </tr>
              </thead>
              <tbody id="ds-history-body"></tbody>
            </table>
          </div>
        </section>
      </div>
    </main>

    {% include 'components/footer.html' %}

    <script>
      window.PLAYER_ID = "{{ player_id }}";
      window.DECK_URL = {{ deck_url | tojson }};
    </script>
    <script src="{{ url_for('static', filename='js/components/navbar.js') }}?v={{ app_version }}"></script>
    <script src="{{ url_for('static', filename='js/pages/deck_stats.js') }}?v={{ app_version }}" defer></script>
  </body>
</html>

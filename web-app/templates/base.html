<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Sorcerers Summit{% endblock %}</title>

    <!-- Tailwind CSS (load first) -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/tailwind.output.css') }}" />

    <!-- Custom CSS (load after for overrides) -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/global.css') }}" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/utilities.css') }}" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/components/navbar.css') }}" />

    <!-- Page-specific CSS -->
    {% block styles %}{% endblock %}
  </head>
  <body class="min-h-screen bg-bg-dark text-text font-sans md:ml-48">
    {% include 'components/navbar.html' %}

    <main class="mt-16 mx-auto max-w-content px-4 sm:px-6 lg:px-8 py-8">
      {% block content %}{% endblock %}
    </main>

    {% include 'components/footer.html' %}

    <!-- Global JS -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script>
      // Load navbar.js with cache-busting timestamp to force fresh fetch
      (function () {
        try {
          var s = document.createElement("script");
          s.src =
            "{{ url_for('static', filename='js/components/navbar.js') }}" +
            "?v=" +
            Date.now();
          s.defer = true;
          document.body.appendChild(s);
        } catch (e) {
          console.error("[base] failed to load navbar.js dynamically", e);
        }
      })();
    </script>

    <!-- Page-specific JS -->
    {% block scripts %}{% endblock %}
  </body>
</html>

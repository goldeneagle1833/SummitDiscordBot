<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Life Counter - Sorcerers Summit</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/pages/life_counter.css') }}?v={{ app_version }}">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #1a1a1a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    .header-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1rem;
      background-color: rgba(26, 26, 26, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(147, 51, 234, 0.2);
    }

    .back-link {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
      color: #FFC107;
      font-weight: 600;
      font-size: 0.875rem;
      transition: all 0.2s ease;
    }

    .back-link:hover {
      color: #FFD54F;
      transform: translateX(-2px);
    }

    .back-arrow {
      font-size: 1.25rem;
      line-height: 1;
    }

    .page-title {
      font-size: 0.875rem;
      font-weight: 600;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <!-- Header Bar -->
  <header class="header-bar">
    <a href="/" class="back-link">
      <span class="back-arrow">←</span>
      <span>Sorcerers Summit</span>
    </a>
    <div class="page-title">Life Counter</div>
  </header>

  <div class="life-counter-container">
  <!-- Opponent's Threshold (Top Bar - Rotated 180°) -->
  <section class="threshold-section opponent-threshold" data-player="player2">
    <div class="threshold-label">Threshold</div>
    <div class="threshold-elements">
      <div class="threshold-element" data-element="water" data-player="player2">
        <button class="element-increment" data-player="player2" data-element="water" aria-label="Increase water">+</button>
        <div class="element-display">
          <img src="{{ url_for('static', filename='images/elements/water.png') }}" alt="Water" class="element-icon">
          <span class="element-counter-value" data-player="player2" data-element="water">0</span>
        </div>
        <button class="element-decrement" data-player="player2" data-element="water" aria-label="Decrease water">−</button>
      </div>
      <div class="threshold-element" data-element="fire" data-player="player2">
        <button class="element-increment" data-player="player2" data-element="fire" aria-label="Increase fire">+</button>
        <div class="element-display">
          <img src="{{ url_for('static', filename='images/elements/fire.png') }}" alt="Fire" class="element-icon">
          <span class="element-counter-value" data-player="player2" data-element="fire">0</span>
        </div>
        <button class="element-decrement" data-player="player2" data-element="fire" aria-label="Decrease fire">−</button>
      </div>
      <div class="threshold-element" data-element="earth" data-player="player2">
        <button class="element-increment" data-player="player2" data-element="earth" aria-label="Increase earth">+</button>
        <div class="element-display">
          <img src="{{ url_for('static', filename='images/elements/earth.png') }}" alt="Earth" class="element-icon">
          <span class="element-counter-value" data-player="player2" data-element="earth">0</span>
        </div>
        <button class="element-decrement" data-player="player2" data-element="earth" aria-label="Decrease earth">−</button>
      </div>
      <div class="threshold-element" data-element="air" data-player="player2">
        <button class="element-increment" data-player="player2" data-element="air" aria-label="Increase air">+</button>
        <div class="element-display">
          <img src="{{ url_for('static', filename='images/elements/wind.png') }}" alt="Air" class="element-icon">
          <span class="element-counter-value" data-player="player2" data-element="air">0</span>
        </div>
        <button class="element-decrement" data-player="player2" data-element="air" aria-label="Decrease air">−</button>
      </div>
    </div>
  </section>

  <!-- Opponent's Life (Player 2 - Rotated 180°) -->
  <section class="life-section opponent-life" data-player="player2">
    <div class="life-display">
      <button class="life-btn increment" data-player="player2" data-amount="1" aria-label="Increase opponent life by 1">
        +1
      </button>
      <div class="life-value-container">
        <span class="life-value" data-player="player2">20</span>
      </div>
      <button class="life-btn decrement" data-player="player2" data-amount="1" aria-label="Decrease opponent life by 1">
        -1
      </button>
    </div>
  </section>

  <!-- Player's Life (Player 1) -->
  <section class="life-section player-life" data-player="player1">
    <div class="life-display">
      <button class="life-btn increment" data-player="player1" data-amount="1" aria-label="Increase life by 1">
        +1
      </button>
      <div class="life-value-container">
        <span class="life-value" data-player="player1">20</span>
      </div>
      <button class="life-btn decrement" data-player="player1" data-amount="1" aria-label="Decrease life by 1">
        -1
      </button>
    </div>
  </section>

  <!-- Player's Threshold (Bottom Bar) -->
  <section class="threshold-section player-threshold" data-player="player1">
    <div class="threshold-elements">
      <div class="threshold-element" data-element="water" data-player="player1">
        <button class="element-increment" data-player="player1" data-element="water" aria-label="Increase water">+</button>
        <div class="element-display">
          <img src="{{ url_for('static', filename='images/elements/water.png') }}" alt="Water" class="element-icon">
          <span class="element-counter-value" data-player="player1" data-element="water">0</span>
        </div>
        <button class="element-decrement" data-player="player1" data-element="water" aria-label="Decrease water">−</button>
      </div>
      <div class="threshold-element" data-element="fire" data-player="player1">
        <button class="element-increment" data-player="player1" data-element="fire" aria-label="Increase fire">+</button>
        <div class="element-display">
          <img src="{{ url_for('static', filename='images/elements/fire.png') }}" alt="Fire" class="element-icon">
          <span class="element-counter-value" data-player="player1" data-element="fire">0</span>
        </div>
        <button class="element-decrement" data-player="player1" data-element="fire" aria-label="Decrease fire">−</button>
      </div>
      <div class="threshold-element" data-element="earth" data-player="player1">
        <button class="element-increment" data-player="player1" data-element="earth" aria-label="Increase earth">+</button>
        <div class="element-display">
          <img src="{{ url_for('static', filename='images/elements/earth.png') }}" alt="Earth" class="element-icon">
          <span class="element-counter-value" data-player="player1" data-element="earth">0</span>
        </div>
        <button class="element-decrement" data-player="player1" data-element="earth" aria-label="Decrease earth">−</button>
      </div>
      <div class="threshold-element" data-element="air" data-player="player1">
        <button class="element-increment" data-player="player1" data-element="air" aria-label="Increase air">+</button>
        <div class="element-display">
          <img src="{{ url_for('static', filename='images/elements/wind.png') }}" alt="Air" class="element-icon">
          <span class="element-counter-value" data-player="player1" data-element="air">0</span>
        </div>
        <button class="element-decrement" data-player="player1" data-element="air" aria-label="Decrease air">−</button>
      </div>
    </div>
    <div class="threshold-label">Threshold</div>
  </section>

  <!-- Match Report Button (appears when life reaches 0) -->
  <button id="report-match-btn" class="btn btn-primary hidden" aria-label="Report match results">
    📝 Report Match
  </button>
</div>

<!-- Match Report Modal (for User Story 2) -->
<div id="match-report-modal" class="modal hidden">
  <div class="modal-content">
    <div class="modal-header">
      <h2>Report Match Results</h2>
      <button class="modal-close" aria-label="Close modal">&times;</button>
    </div>
    <div class="modal-body">
      <p class="match-summary">Match ended!</p>
      <form id="match-report-form">
        <p class="text-muted">Match reporting not yet implemented.</p>
      </form>
    </div>
  </div>
</div>

<!-- Confirmation Modal (for User Story 3) -->
<div id="confirmation-modal" class="modal hidden">
  <div class="modal-content">
    <div class="modal-header">
      <h2>Match Confirmation Request</h2>
      <button class="modal-close" aria-label="Close modal">&times;</button>
    </div>
    <div class="modal-body">
      <p class="confirmation-message">You have a pending match confirmation.</p>
      <div class="confirmation-actions">
        <button class="btn btn-primary" id="confirm-match-btn">Confirm</button>
        <button class="btn btn-danger" id="dispute-match-btn">Dispute</button>
      </div>
    </div>
  </div>
</div>

<script src="{{ url_for('static', filename='js/pages/life_counter.js') }}?v={{ app_version }}"></script>
</body>
</html>
